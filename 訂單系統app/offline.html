<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0F172A">
  <title>訂單系統｜離線</title>
  <style>
    *{box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:#F8FAFC;color:#0F172A;margin:0;display:grid;place-items:center;min-height:100vh;padding:24px}
    .c{width:min(100%,420px);background:#FFFFFF;border:1px solid #E2E8F0;border-radius:20px;padding:30px;text-align:center;box-shadow:0 18px 46px rgba(15,23,42,.08)}
    .mark{width:64px;height:64px;margin:0 auto 16px;border-radius:18px;background:#0F172A;display:grid;place-items:center}
    .mark:before{content:"";width:30px;height:36px;border:4px solid #FFFFFF;border-radius:6px;box-shadow:inset 0 8px 0 #2563EB}
    h1{margin:0 0 8px;font-size:26px}
    h2{margin:0 0 12px;font-size:18px}
    p{margin:0 0 20px;color:#64748B;line-height:1.7}
    button{border:0;border-radius:12px;padding:12px 18px;background:#0F172A;color:#FFFFFF;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <div class="c">
    <div class="mark" aria-hidden="true"></div>
    <h1>訂單系統</h1>
    <h2>目前無網路連線</h2>
    <p>接單、點餐與資料更新需要網路連線。恢復網路後即可繼續使用。</p>
    <button onclick="location.reload()">重新連線</button>
  </div>
</body>
</html>
