<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3e6d1"><title>脆日炸雞｜手機點餐</title><style>:root{--bg:#f5ead8;--card:#fffdf8;--tea:#e7d2b6;--tea2:#d6b88f;--yellow:#ffe36a;--yellow2:#fff4b8;--orange:#f39a4a;--ink:#2d241c;--muted:#746657;--line:#e6d7c4;--deep:#35281d;--bad:#aa3f35;--green:#32715a}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:linear-gradient(180deg,#f7eddc 0,#f4e6d1 58%,#f2e1c8 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px 16px 124px}.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start;padding:10px 2px 18px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.15em;color:#9a6230}.brand{font-size:34px;font-weight:950;letter-spacing:-1.4px;margin-top:6px}.tagline{font-size:13px;color:var(--muted);margin-top:6px}.contact{min-width:190px;border-left:1px solid rgba(88,65,42,.18);padding-left:14px;margin-top:4px}.contact .r{margin-bottom:9px}.contact .k{font-size:10px;font-weight:900;letter-spacing:.12em;color:#9b7c59}.contact .v{font-size:13px;font-weight:800;color:#4d4034;line-height:1.4;margin-top:2px}.card{background:rgba(255,253,248,.96);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 8px 28px rgba(86,61,32,.04)}.mode-title{font-size:13px;font-weight:950;color:#4a3b2d;margin-bottom:9px}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mode{border:1px solid var(--line);background:#fffaf2;color:#5b4a39;border-radius:14px;min-height:54px;font-size:16px;font-weight:950}.mode.active{background:var(--yellow);border-color:#e8c647;color:#34281a;box-shadow:0 0 0 3px rgba(255,227,106,.28)}.table-wrap{margin-top:13px;padding-top:13px;border-top:1px dashed #decab0}.field-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;font-weight:950;color:#493729;margin-bottom:7px}.field-label span{font-size:11px;font-weight:800;color:#9a6c3c}.table-input{width:100%;border:2px solid #dbc7aa;background:#fff;border-radius:13px;padding:13px 14px;font-size:17px;font-weight:850;color:#2f251c;outline:none}.table-input:focus{border-color:#e7bd35;box-shadow:0 0 0 4px rgba(255,227,106,.24)}.table-input:disabled{background:#efe5d5;color:#9b8c7d}.helper{font-size:12px;color:#8a735c;margin-top:7px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:22px 2px 9px}.section{font-size:20px;font-weight:950;letter-spacing:-.5px}.section-note{font-size:12px;color:var(--muted)}.catnav{display:flex;gap:8px;overflow:auto;padding:2px 1px 10px;scrollbar-width:none}.catnav::-webkit-scrollbar{display:none}.catnav button{white-space:nowrap;border:1px solid #ddc8aa;background:#fff8ea;color:#5c4935;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:900}.cat-title{display:flex;align-items:center;gap:8px;padding:14px 0 4px;font-size:14px;font-weight:950;color:#4a3829}.cat-dot{width:9px;height:9px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px #ffe3c8}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid #efe4d3}.item:last-child{border-bottom:0}.item-name{font-size:16px;font-weight:900}.price{font-size:13px;color:#8b7159;margin-top:4px}.qty{display:flex;align-items:center;gap:9px}.qty button{width:39px;height:39px;border-radius:12px;border:1px solid #dcc8ab;background:#fff9ef;font-size:20px;font-weight:900;color:#4a3829}.qty button:last-child{background:var(--yellow);border-color:#e3c342;color:#30251a}.qty b{min-width:20px;text-align:center;font-size:16px}.payrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:13px;min-height:48px;padding:12px 15px;font-size:15px;font-weight:950;cursor:pointer}.pay{background:#fff9f0;border:1px solid #ddc9ad;color:#493b2f}.pay.active{background:var(--yellow2);border:2px solid #e3bd31;color:#3c2e1f}.notice{border-radius:12px;padding:11px 12px;margin-bottom:11px;font-size:13px;background:#fff1d6;border:1px solid #f0d199;color:#795328}.notice.bad{background:#fff0ee;border-color:#efcac5;color:var(--bad)}textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px;font-size:16px;color:var(--ink);resize:vertical;outline:none}.loading{text-align:center;padding:28px;color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}.sticky{position:fixed;left:0;right:0;bottom:0;padding:10px 14px max(10px,env(safe-area-inset-bottom));background:rgba(244,229,207,.88);backdrop-filter:blur(16px);border-top:1px solid rgba(74,53,31,.08);z-index:8}.sticky-in{max-width:724px;margin:auto;background:var(--deep);border:2px solid #231a13;border-radius:18px;padding:11px 12px 11px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 10px 28px rgba(50,35,20,.24)}.metric{font-size:11px;font-weight:950;letter-spacing:.12em;color:#f0c98f}.total{font-size:30px;line-height:1.05;font-weight:950;color:#fff}.submit{background:var(--yellow);color:#2b2117;border:2px solid #ffe979;min-width:145px;font-size:16px;box-shadow:0 4px 0 #caa937}.submit:active{transform:translateY(2px);box-shadow:0 2px 0 #caa937}.submit:disabled{background:#766653;color:#b9aa98;border-color:#766653;box-shadow:none;opacity:1}.done{text-align:center;padding:34px 20px}.order-no{font-size:58px;font-weight:950;margin:10px 0}.done-total{font-size:28px;font-weight:950}.done-btn{background:var(--deep);color:#fff;width:100%}@media(max-width:560px){.hero{grid-template-columns:1fr}.contact{border-left:0;border-top:1px solid rgba(88,65,42,.14);padding:10px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}.contact .r{margin:0}.brand{font-size:31px}}@media(max-width:390px){.wrap{padding-left:12px;padding-right:12px}.mode{min-height:50px}.contact{grid-template-columns:1fr}.sticky{padding-left:9px;padding-right:9px}.submit{min-width:132px}}</style></head><body><main id="root" class="wrap"><header class="hero"><div><div class="eyebrow">CRISP DAY · ZHONGXIAO</div><div class="brand">脆日炸雞</div><div class="tagline">現點現炸・掃碼點餐・依取餐號叫號</div></div><div class="contact"><div class="r"><div class="k">TEL</div><div class="v">0900-000-000</div></div><div class="r"><div class="k">LOCATION</div><div class="v">台中市南區忠孝路<br>忠孝夜市</div></div></div></header><div id="notice"></div><section class="card"><div class="mode-title">用餐方式</div><div id="modeGrid" class="mode-grid"><button class="mode active" data-mode="外帶">外帶取餐</button><button class="mode" data-mode="內用">店內用餐</button></div><div class="table-wrap"><div class="field-label">桌號 <span id="tableHint">外帶免填</span></div><input id="tableNo" class="table-input" inputmode="numeric" placeholder="選擇內用後填寫桌號" disabled><div id="modeHelper" class="helper">目前為外帶，完成後請依取餐號取餐。</div></div></section><div class="section-head"><div class="section">炸物菜單</div><div class="section-note">25 項・不含飲料</div></div><div id="catnav" class="catnav"></div><section id="menu" class="card"><div class="loading">菜單載入中…</div></section><section class="card"><div class="mode-title">訂單備註</div><textarea id="note" rows="2" maxlength="120" placeholder="例如：不要辣、胡椒少一點、醬另放"></textarea></section><section class="card"><div class="mode-title">付款方式</div><div id="payrow" class="payrow"><button class="btn pay active" data-pay="現金">現金</button><button class="btn pay" data-pay="LINE Pay">LINE Pay</button></div><div class="tiny" style="margin-top:9px">測試版 LINE Pay 先以模擬付款完成處理。</div></section></main><div class="sticky"><div class="sticky-in"><div><div class="metric">ORDER TOTAL</div><div id="total" class="total">$0</div></div><button id="submit" class="btn submit" disabled>送出訂單</button></div></div><script>const REST='https://uuefhkqtslcdkdgeyiof.supabase.co/rest/v1/rpc',KEY='sb_publishable_v_Yzne9MJIj-9sjXYN-NDA_iA_u8wii';let menu=[],cart={},pay='現金',mode='外帶',sending=false;const $=s=>document.querySelector(s),money=n=>'$'+Number(n||0).toLocaleString('zh-TW'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function rpc(n,b){const r=await fetch(REST+'/'+n,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(b||{})}),t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={message:t}}if(!r.ok)throw new Error(d.message||d.error||'連線失敗');return d}function notice(m,b=false){$('#notice').innerHTML=m?'<div class="notice'+(b?' bad':'')+'">'+esc(m)+'</div>':''}function sum(){return menu.reduce((s,x)=>s+Number(x.price||0)*(cart[x.id]||0),0)}function bottom(){const t=sum();$('#total').textContent=money(t);$('#submit').disabled=t<=0||sending}function render(){const cats=[...new Set(menu.map(x=>x.category||'其他'))];$('#catnav').innerHTML=cats.map((c,i)=>'<button data-cat="cat'+i+'">'+esc(c)+'</button>').join('');$('#menu').innerHTML=cats.map((c,i)=>'<div id="cat'+i+'" class="cat-title"><span class="cat-dot"></span>'+esc(c)+'</div>'+menu.filter(x=>(x.category||'其他')===c).map(x=>{const q=cart[x.id]||0;return '<div class="item"><div><div class="item-name">'+esc(x.name)+'</div><div class="price">'+money(x.price)+'</div></div><div class="qty"><button data-id="'+x.id+'" data-d="-1">−</button><b>'+q+'</b><button data-id="'+x.id+'" data-d="1">＋</button></div></div>'}).join('')).join('');bottom()}$('#menu').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(!b)return;const id=Number(b.dataset.id),d=Number(b.dataset.d);cart[id]=Math.max(0,(cart[id]||0)+d);render()});$('#catnav').addEventListener('click',e=>{const b=e.target.closest('button[data-cat]');if(!b)return;document.getElementById(b.dataset.cat)?.scrollIntoView({behavior:'smooth',block:'start'})});$('#modeGrid').addEventListener('click',e=>{const b=e.target.closest('.mode');if(!b)return;mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');const indoor=mode==='內用';$('#tableNo').disabled=!indoor;$('#tableHint').textContent=indoor?'請填桌號':'外帶免填';$('#modeHelper').textContent=indoor?'請輸入桌號，送單後餐點會送至桌邊。':'目前為外帶，完成後請依取餐號取餐。';if(indoor){$('#tableNo').placeholder='例如：3';setTimeout(()=>$('#tableNo').focus(),80)}else{$('#tableNo').value='';$('#tableNo').placeholder='選擇內用後填寫桌號'}});$('#payrow').addEventListener('click',e=>{const b=e.target.closest('.pay');if(!b)return;pay=b.dataset.pay;document.querySelectorAll('.pay').forEach(x=>x.classList.remove('active'));b.classList.add('active')});async function load(){try{const d=await rpc('smallshop_get_menu',{});menu=Array.isArray(d.menu)?d.menu:[];if(!menu.length)throw new Error('目前沒有可販售商品');render();notice('')}catch(e){$('#menu').innerHTML='<div class="loading" style="color:#aa3f35">菜單載入失敗</div>';notice('無法取得菜單，請重新整理頁面。',true)}}$('#submit').addEventListener('click',async()=>{if(sending)return;const items=menu.filter(x=>(cart[x.id]||0)>0).map(x=>({id:x.id,qty:cart[x.id]}));if(!items.length)return;if(mode==='內用'&&!$('#tableNo').value.trim()){notice('內用請先填寫桌號。',true);$('#tableNo').focus();return}sending=true;bottom();$('#submit').textContent='送出中…';notice('');try{const d=await rpc('smallshop_create_order',{p_items:items,p_dining_type:mode,p_payment_method:pay,p_note:$('#note').value.trim(),p_table_no:$('#tableNo').value.trim()}),o=d.order;document.querySelector('.sticky').remove();$('#root').innerHTML='<section class="card done" style="margin-top:38px"><div class="eyebrow">ORDER CONFIRMED</div><div class="brand" style="font-size:26px;margin-top:8px">脆日炸雞</div><div class="order-no">'+esc(o.order_no)+'</div><div class="done-total">'+money(o.total)+'</div><p class="tagline">'+esc(o.dining_type)+(o.table_no?'・桌 '+esc(o.table_no):'')+'・'+esc(o.payment_method)+'</p><p class="notice">訂單已送出，請留意取餐號。</p><button id="again" class="btn done-btn">繼續點餐</button></section>';$('#again').onclick=()=>location.reload()}catch(e){sending=false;$('#submit').textContent='送出訂單';bottom();notice(e.message||'訂單送出失敗',true)}});load();</script></body></html>
