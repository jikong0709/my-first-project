<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FFE36A"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./app.css"><style>.gate-stack{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.gate-stack input,.form-grid input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;background:#fff;color:var(--ink)}.form-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}.form-grid label{font-size:12px;font-weight:900;color:var(--muted)}.form-grid input{display:block;margin-top:5px}.check{display:flex;gap:8px;align-items:center;font-weight:850;margin-top:12px}.qr-card{text-align:center}.qr-image{width:min(340px,90%);background:#fff;border-radius:16px;padding:12px;border:1px solid var(--line)}.qr-url{font-size:12px;word-break:break-all;background:#f7efe3;padding:10px;border-radius:10px;margin:12px 0}.tabs{grid-template-columns:repeat(4,1fr)}@media(max-width:700px){.gate-stack,.form-grid{grid-template-columns:1fr 1fr}.tabs{grid-template-columns:1fr 1fr}}@media(max-width:520px){.gate-stack,.form-grid{grid-template-columns:1fr}}</style><title>店家管理 App</title></head><body><main class="wrap"><header class="top"><div><div id="brandEn" class="eyebrow">STORE APP</div><div id="brandName" class="brand">店家管理</div><div class="sub">即時接單・菜單管理・營業流水帳</div><div class="chips"><span id="storeMeta" class="chip">Tenant Store</span><span class="chip">PWA 安裝版</span></div></div><div class="top-actions"><button id="installBtn" class="btn accent hide">安裝 App</button><a id="customerOrderLink" class="btn ghost" href="./order" target="_blank" rel="noopener">客戶點餐頁</a><button id="refresh" class="btn ghost">更新</button><button id="logout" class="btn danger">登出</button></div></header><div id="installNote" class="install-note hide"></div><div id="status"></div><section id="gate" class="card gate"><div style="font-weight:950;margin-bottom:8px">店家登入</div><div class="gate-stack"><input id="storeSlug" autocomplete="username" placeholder="店家代碼，例如 crisp-day"><input id="passcode" type="password" inputmode="numeric" autocomplete="current-password" placeholder="店家密碼"><button id="login" class="btn primary">登入</button></div></section><div id="app" class="hide"><div class="tabs"><button class="btn tab active" data-pane="orders">即時接單</button><button class="btn tab ghost" data-pane="menu">菜單管理</button><button class="btn tab ghost" data-pane="ledger">流水帳</button><button class="btn tab ghost" data-pane="qr">QR Code</button></div><section id="ordersPane"><div id="orderMetrics" class="metrics"></div><div class="sec">今日訂單</div><div id="orders"></div></section><section id="menuPane" class="hide"><section class="card"><div class="sec" style="margin-top:0">新增／編輯商品</div><input id="menuId" type="hidden"><div class="form-grid"><label>商品名稱<input id="menuName" maxlength="80"></label><label>價格<input id="menuPrice" inputmode="numeric" type="number" min="0"></label><label>分類<input id="menuCategory" maxlength="40" placeholder="其他"></label><label>排序<input id="menuSort" inputmode="numeric" type="number" value="0"></label></div><label class="check"><input id="menuActive" type="checkbox" checked> 上架販售</label><div class="row" style="margin-top:12px"><button id="saveMenu" class="btn primary">儲存商品</button><button id="newMenu" class="btn ghost">清空／新增</button></div></section><section class="card tablewrap"><table class="table"><thead><tr><th>商品</th><th>價格</th><th>分類</th><th>狀態</th><th>排序</th><th></th></tr></thead><tbody id="menuAdminList"></tbody></table></section></section><section id="ledgerPane" class="hide"><section class="card"><div class="filters"><div><div class="tiny">開始日期</div><input id="from" type="date"></div><div><div class="tiny">結束日期</div><input id="to" type="date"></div><button id="today" class="btn soft">今天</button><button id="month" class="btn soft">本月</button></div><div class="row" style="margin-top:10px"><button id="query" class="btn primary">查詢帳目</button><button id="csv" class="btn ghost">匯出 CSV</button></div></section><div id="ledgerMetrics" class="metrics"></div><div class="sec">每日營業摘要</div><section class="card tablewrap"><table class="table"><thead><tr><th>日期</th><th>訂單</th><th>營業額</th><th>現金</th><th>LINE Pay</th><th>未收款</th></tr></thead><tbody id="daily"></tbody></table></section><div class="sec">熱銷商品</div><section id="products" class="card"></section><div class="sec">訂單流水</div><section class="card tablewrap"><table class="table"><thead><tr><th>時間</th><th>訂單</th><th>餐點</th><th>金額</th><th>付款</th><th>收款</th><th>狀態</th></tr></thead><tbody id="ledgerOrders"></tbody></table></section></section><section id="qrPane" class="hide"><section class="card qr-card"><div class="sec" style="margin-top:0">店家點餐 QR Code</div><img id="qrImage" class="qr-image" alt="店家點餐 QR Code"><div id="qrUrl" class="qr-url"></div><div class="row" style="justify-content:center"><button id="copyQrUrl" class="btn primary">複製點餐網址</button><a id="customerOrderLink2" class="btn ghost" href="#" target="_blank" rel="noopener">開啟點餐頁</a></div></section></section></div></main><script src="./admin.js"></script><script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
