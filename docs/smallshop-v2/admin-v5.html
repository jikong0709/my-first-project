<!doctype html>
<html lang="zh-Hant">
<head>

<title>阿財小吃｜店家後台 V5</title>
<style>

ilters{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}.table th{font-size:12px;color:var(--muted)}.rank{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}.empty{text-align:center;padding:24px;color:var(--muted)}button:disabled{opacity:.45}@media(min-width:760px){.metrics{grid-template-columns:repeat(6,1fr)}.filters{grid-template-columns:1fr 1fr auto auto}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><div><div class="brand">阿財小吃｜店家後台 V5</div><div class="sub">即時接單＋營業流水帳</div></div><button id="refresh" class="btn ghost">更新</button></div>
  <section id="gate" class="card gate"><div style="font-weight:900;margin-bottom:8px">店家管理 PIN</div><div class="row"><input id="pin" inputmode="numeric" value="2468"><button id="login" class="btn primary">進入</button></div></section>
  <div id="app" class="hide">
    <div class="tabs"><button id="tabOrders" class="btn tab active">即時接單</button><button id="tabLedger" class="btn tab ghost">營業流水帳</button></div>
    <div id="status"></div>
    <section id="ordersPane"><div id="orderMetrics" class="metrics"></div><div class="sec">即時訂單</div><div id="orders"></div></section>
    <section id="ledgerPane" class="hide">
      <section class="card"><div class="filters"><div><div class="tiny">開始日期</div><input id="from" type="date"></div><div><div class="tiny">結束日期</div><input id="to" type="date"></div><button id="today" class="btn soft">今天</button><button id="month" class="btn soft">本月</button></div><div class="row" style="margin-top:10px"><button id="query" class="btn primary">查詢帳目</button><button id="xlsx" class="btn ghost">下載 Excel (.xlsx)</button></div><div class="tiny" style="margin-top:8px">Excel 版不經過 CSV 匯入，直接產生原生工作簿。</div></section>
      <div id="ledgerMetrics" class="metrics"></div>
      <div class="sec">每日營業摘要</div><section class="card tablewrap"><table class="table"><thead><tr><th>日期</th><th>訂單</th><th>營業額</th><th>現金</th><th>LINE Pay</th><th>未收款</th></tr></thead><tbody id="daily"></tbody></table></section>
      <div class="sec">熱銷商品</div><section id="products" class="card"></section>
      <div class="sec">訂單流水</div><section class="card tablewrap"><table class="table"><thead><tr><th>時間</th><th>訂單</th><th>餐點</th><th>金額</th><th>付款</th><th>收款</th><th>狀態</th></tr></thead><tbody id="ledgerOrders"></tbody></table></section>
    </section>
  </div>
</main>
<script>
const REST='https://uuefhkqtslcdkdgeyiof.supabase.co/rest/v1/rpc';
const KEY='sb_publishable_v_Yzne9MJIj-9sjXYN-NDA_iA_u8wii';
let pin='2468',timer=null,currentPane='orders',lastLedger=null;
const $=s=>document.querySelector(s),money=n=>'$'+Number(n||0).toLocaleString('zh-TW');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function rpc(name,body){const r=await fetch(REST+'/'+name,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={message:t}}if(!r.ok)throw new Error(d.message||'連線失敗');return d}
function showStatus(m,b=false){$('#status').innerHTML=m?'<div class="status'+(b?' bad':'')+'">'+esc(m)+'</div>':''}
function twDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function dayOf(v){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(v))}
function fmtTime(v){const p=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date(v)),g=t=>p.find(x=>x.type===t)?.value||'';return g('year')+'-'+g('month')+'-'+g('day')+' '+g('hour')+':'+g('minute')+':'+g('second')}
function setToday(){const d=twDate();$('#from').value=d;$('#to').value=d}function setMonth(){const d=twDate();$('#from').value=d.slice(0,8)+'01';$('#to').value=d}
function setPane(n){currentPane=n;const o=n==='orders';$('#ordersPane').classList.toggle('hide',!o);$('#ledgerPane').classList.toggle('hide',o);$('#tabOrders').className='btn tab '+(o?'active':'ghost');$('#tabLedger').className='btn tab '+(!o?'active':'ghost');showStatus('');if(!o)loadLedger()}
function orderMetrics(a){const v=a.filter(o=>o.status!=='已取消');return{revenue:v.filter(o=>o.payment_status==='已收款').reduce((s,o)=>s+Number(o.total||0),0),count:v.length,unpaid:v.filter(o=>o.payment_status==='未收款').length,making:v.filter(o=>o.status==='製作中').length}}
async function loadOrders(){try{const d=await rpc('smallshop_admin_orders',{p_pin:pin}),a=Array.isArray(d.orders)?d.orders:[],m=orderMetrics(a);$('#gate').classList.add('hide');$('#app').classList.remove('hide');showStatus('');$('#orderMetrics').innerHTML=`<section class="card"><div class="metric">今日營業額</div><div class="big">${money(m.revenue)}</div></section><section class="card"><div class="metric">今日訂單</div><div class="big">${m.count}</div></section><section class="card"><div class="metric">未收款</div><div class="big">${m.unpaid}</div></section><section class="card"><div class="metric">製作中</div><div class="big">${m.making}</div></section>`;$('#orders').innerHTML=a.length?a.map(o=>`<section class="card order"><div class="row between"><div><span class="num">${esc(o.order_no)}</span> <span class="pill">${esc(o.status)}</span></div><b>${money(o.total)}</b></div><div class="items">${(o.items||[]).map(x=>esc(x.name)+' ×'+x.qty).join('、')}</div><div class="sub">${esc(o.dining_type)}${o.table_no?'・桌 '+esc(o.table_no):''}・${esc(o.payment_method)}・${esc(o.payment_status)}</div>${o.note?'<div class="note">備註：'+esc(o.note)+'</div>':''}<div class="row" style="margin-top:10px">${o.payment_status==='未收款'?`<button class="btn soft act" data-id="${o.id}" data-a="paid">確認收款</button>`:''}${o.status==='新訂單'?`<button class="btn primary act" data-id="${o.id}" data-a="making">開始製作</button>`:''}${o.status==='製作中'?`<button class="btn primary act" data-id="${o.id}" data-a="done">完成</button>`:''}${o.status!=='已完成'&&o.status!=='已取消'?`<button class="btn danger act" data-id="${o.id}" data-a="cancel">取消</button>`:''}</div></section>`).join(''):'<section class="card empty">目前沒有訂單</section>';document.querySelectorAll('.act').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await rpc('smallshop_admin_update',{p_pin:pin,p_id:Number(b.dataset.id),p_action:b.dataset.a});await loadOrders()}catch(e){showStatus(e.message,true);b.disabled=false}})}catch(e){$('#gate').classList.remove('hide');$('#app').classList.add('hide');showStatus(e.message||'後台讀取失敗',true)}}
function summarize(a){const v=a.filter(o=>o.status!=='已取消'),p=v.filter(o=>o.payment_status==='已收款'),daily={},products={};for(const o of v){const k=dayOf(o.created_at);daily[k]??={date:k,orders:0,revenue:0,cash:0,linepay:0,unpaid:0};daily[k].orders++;if(o.payment_status==='已收款'){daily[k].revenue+=Number(o.total||0);if(o.payment_method==='LINE Pay')daily[k].linepay+=Number(o.total||0);else daily[k].cash+=Number(o.total||0)}else daily[k].unpaid++;for(const it of (o.items||[])){const n=String(it.name||'商品');products[n]??={name:n,qty:0,amount:0};products[n].qty+=Number(it.qty||0);products[n].amount+=Number(it.price||0)*Number(it.qty||0)}}const revenue=p.reduce((s,o)=>s+Number(o.total||0),0),cash=p.filter(o=>o.payment_method==='現金').reduce((s,o)=>s+Number(o.total||0),0),linepay=p.filter(o=>o.payment_method==='LINE Pay').reduce((s,o)=>s+Number(o.total||0),0);return{metrics:{revenue,cash,linepay,orders:v.length,unpaid:v.filter(o=>o.payment_status==='未收款').length,average:v.length?Math.round(revenue/v.length):0},daily:Object.values(daily).sort((a,b)=>b.date.localeCompare(a.date)),products:Object.values(products).sort((a,b)=>b.qty-a.qty)}}
async function loadLedger(){const from=$('#from').value,to=$('#to').value;if(!from||!to)return;$('#query').disabled=true;try{const d=await rpc('smallshop_ledger',{p_pin:pin,p_from:from,p_to:to}),a=Array.isArray(d.orders)?d.orders:[],s=summarize(a),m=s.metrics;lastLedger={from:d.from||from,to:d.to||to,orders:a,daily:s.daily,products:s.products,metrics:m};$('#ledgerMetrics').innerHTML=`<section class="card"><div class="metric">營業額</div><div class="big">${money(m.revenue)}</div></section><section class="card"><div class="metric">訂單</div><div class="big">${m.orders}</div></section><section class="card"><div class="metric">平均客單</div><div class="big">${money(m.average)}</div></section><section class="card"><div class="metric">現金</div><div class="big">${money(m.cash)}</div></section><section class="card"><div class="metric">LINE Pay</div><div class="big">${money(m.linepay)}</div></section><section class="card"><div class="metric">未收款</div><div class="big">${m.unpaid}</div></section>`;$('#daily').innerHTML=s.daily.length?s.daily.map(x=>`<tr><td>${esc(x.date)}</td><td>${x.orders}</td><td><b>${money(x.revenue)}</b></td><td>${money(x.cash)}</td><td>${money(x.linepay)}</td><td>${x.unpaid}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">沒有資料</td></tr>';$('#products').innerHTML=s.products.length?s.products.slice(0,20).map((x,i)=>`<div class="rank"><div><b>${i+1}. ${esc(x.name)}</b></div><div>${x.qty} 份</div><div><b>${money(x.amount)}</b></div></div>`).join(''):'<div class="empty">沒有商品銷售資料</div>';$('#ledgerOrders').innerHTML=a.length?a.map(o=>`<tr><td>${esc(fmtTime(o.created_at))}</td><td><b>${esc(o.order_no)}</b></td><td>${esc((o.items||[]).map(x=>x.name+'×'+x.qty).join('、'))}</td><td><b>${money(o.total)}</b></td><td>${esc(o.payment_method)}</td><td>${esc(o.payment_status)}</td><td>${esc(o.status)}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">沒有訂單</td></tr>';showStatus('')}catch(e){showStatus(e.message||'帳目讀取失敗',true)}finally{$('#query').disabled=false}}
function xmlEsc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))}
function colName(n){let s='';for(;n;n=Math.floor((n-1)/26))s=String.fromCharCode(65+(n-1)%26)+s;return s}
function sheetXml(rows,widths){let out='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0" rightToLeft="0" showGridLines="1"/></sheetViews><cols>'+widths.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols><sheetData>';rows.forEach((r,ri)=>{out+=`<row r="${ri+1}">`;r.forEach((v,ci)=>{const ref=colName(ci+1)+(ri+1);if(typeof v==='number'&&Number.isFinite(v))out+=`<c r="${ref}" t="n"><v>${v}</v></c>`;else out+=`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`});out+='</row>'});return out+'</sheetData></worksheet>'}
function crc32(bytes){let c=-1;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xEDB88320:0)}return(c^-1)>>>0}
function u16(n){return new Uint8Array([n&255,(n>>>8)&255])}function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}
function joinBytes(parts){const len=parts.reduce((s,p)=>s+p.length,0),o=new Uint8Array(len);let x=0;for(const p of parts){o.set(p,x);x+=p.length}return o}
function zipStore(files){const te=new TextEncoder(),locals=[],centrals=[];let offset=0;for(const f of files){const name=te.encode(f.name),data=te.encode(f.data),crc=crc32(data),local=joinBytes([u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data]);locals.push(local);centrals.push(joinBytes([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]));offset+=local.length}const central=joinBytes(centrals),body=joinBytes(locals),end=joinBytes([u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(central.length),u32(body.length),u16(0)]);return joinBytes([body,central,end])}
function exportXlsx(){if(!lastLedger){showStatus('請先查詢帳目',true);return}const orders=[['時間','訂單','餐點','金額','付款方式','收款狀態','訂單狀態']];lastLedger.orders.forEach(o=>orders.push([fmtTime(o.created_at),o.order_no,(o.items||[]).map(x=>x.name+' x'+x.qty).join('、'),Number(o.total||0),o.payment_method,o.payment_status,o.status]));const daily=[['日期','訂單','營業額','現金','LINE Pay','未收款']];lastLedger.daily.forEach(x=>daily.push([x.date,x.orders,x.revenue,x.cash,x.linepay,x.unpaid]));const summary=[['期間',lastLedger.from+' ~ '+lastLedger.to],['營業額',lastLedger.metrics.revenue],['訂單',lastLedger.metrics.orders],['平均客單',lastLedger.metrics.average],['現金',lastLedger.metrics.cash],['LINE Pay',lastLedger.metrics.linepay],['未收款',lastLedger.metrics.unpaid]];const files=[{name:'[Content_Types].xml',data:'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/worksheets/sheet2.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/worksheets/sheet3.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'},{name:'_rels/.rels',data:'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},{name:'xl/workbook.xml',data:'<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><bookViews><workbookView activeTab="0"/></bookViews><sheets><sheet name="訂單流水" sheetId="1" r:id="rId1"/><sheet name="每日摘要" sheetId="2" r:id="rId2"/><sheet name="營業摘要" sheetId="3" r:id="rId3"/></sheets></workbook>'},{name:'xl/_rels/workbook.xml.rels',data:'<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet2.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet3.xml"/></Relationships>'},{name:'xl/worksheets/sheet1.xml',data:sheetXml(orders,[21,12,42,12,14,14,14])},{name:'xl/worksheets/sheet2.xml',data:sheetXml(daily,[15,10,14,14,14,12])},{name:'xl/worksheets/sheet3.xml',data:sheetXml(summary,[18,22])}];const bytes=zipStore(files),blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),href=URL.createObjectURL(blob),a=document.createElement('a');a.href=href;a.download='營業流水帳_'+lastLedger.from+'_'+lastLedger.to+'.xlsx';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),1500);showStatus('Excel 檔已下載：原生 .xlsx，不使用 CSV。')}
$('#login').onclick=()=>{pin=$('#pin').value.trim();loadOrders();clearInterval(timer);timer=setInterval(()=>{if(currentPane==='orders')loadOrders()},3000)};$('#refresh').onclick=()=>currentPane==='orders'?loadOrders():loadLedger();$('#tabOrders').onclick=()=>setPane('orders');$('#tabLedger').onclick=()=>setPane('ledger');$('#today').onclick=()=>{setToday();loadLedger()};$('#month').onclick=()=>{setMonth();loadLedger()};$('#query').onclick=loadLedger;$('#xlsx').onclick=exportXlsx;setToday();loadOrders();timer=setInterval(()=>{if(currentPane==='orders')loadOrders()},3000);
</script>
</body></html>
