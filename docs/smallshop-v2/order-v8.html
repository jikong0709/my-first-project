<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3e5d2">
<title>炸雞店｜手機點餐</title>
<style>
:root{
  --bg:#f5eadb;
  --bg2:#fff7e9;
  --card:#fffdf8;
  --ink:#3b2b23;
  --muted:#8a7769;
  --line:#eadbc8;
  --milk:#ead7bd;
  --yellow:#ffd84d;
  --yellow2:#fff1a8;
  --orange:#ff8a3d;
  --orange2:#fff0e4;
  --cocoa:#3b2920;
  --green:#6f8d55;
  --bad:#b42318;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:linear-gradient(180deg,#f7eddf 0,#f5eadb 48%,#f0e2cf 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}
button,input,textarea{font:inherit}
.wrap{max-width:720px;margin:auto;padding:18px 14px 126px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#fff8e8,#f1dcc1);border:1px solid #ead7bd;border-radius:24px;padding:22px 20px;margin-bottom:14px;box-shadow:0 12px 30px rgba(91,65,42,.08)}
.hero:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:var(--yellow);right:-56px;top:-60px;opacity:.85}
.hero:before{content:"";position:absolute;width:82px;height:82px;border-radius:50%;background:var(--orange);right:60px;bottom:-48px;opacity:.18}
.eyebrow{position:relative;z-index:1;display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;background:#fff2bb;color:#6d4d17;font-size:11px;font-weight:900;letter-spacing:.08em}
.brand{position:relative;z-index:1;font-size:34px;line-height:1.05;font-weight:950;letter-spacing:-1.2px;margin-top:12px}
.sub{position:relative;z-index:1;font-size:13px;color:var(--muted);margin-top:7px;line-height:1.5}
.notice{border-radius:14px;padding:11px 12px;margin-bottom:12px;font-size:13px;background:#fff3dc;border:1px solid #f4d7a2;color:#77521c}
.notice.bad{background:#fff1ef;border-color:#f6c7c3;color:var(--bad)}
.step-card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 7px 20px rgba(76,51,32,.05)}
.step-head{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.step-no{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--yellow);color:#4e3915;font-weight:950;font-size:13px;box-shadow:inset 0 -2px 0 rgba(100,70,0,.08)}
.step-title{font-size:17px;font-weight:950;color:#34231b;letter-spacing:-.3px}
.step-tip{font-size:12px;color:var(--muted);margin-left:auto}
.dining-switch{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.dining-btn{min-height:52px;border-radius:14px;border:1px solid var(--line);background:#fffaf3;color:#69584d;font-weight:900;font-size:16px;cursor:pointer;transition:.15s}
.dining-btn.active{background:var(--cocoa);border-color:var(--cocoa);color:#fff;box-shadow:0 7px 18px rgba(59,41,32,.16)}
.dining-btn.active[data-value="內用"]{background:var(--orange);border-color:var(--orange);color:#fff}
.table-box{margin-top:13px;padding-top:13px;border-top:1px dashed #e6d2b9}
.table-label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.table-title{font-size:15px;font-weight:950;color:#3d2b21}
.table-note{font-size:11px;font-weight:850;color:#9a806b;background:#f3eadf;border-radius:999px;padding:5px 8px}
#tableNo{width:100%;min-height:50px;border:2px solid #e3cda9;background:#fffdf8;border-radius:14px;padding:12px 14px;font-size:17px;font-weight:800;color:#3b2b23;outline:none;transition:.15s}
#tableNo::placeholder{color:#b29c89;font-weight:650}
#tableNo:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,138,61,.13)}
#tableNo:disabled{background:#f2e9dd;color:#ab9886;border-color:#eadfce}
.section-title{display:flex;align-items:end;justify-content:space-between;gap:8px;margin:24px 2px 9px}
.section-title b{font-size:20px;font-weight:950;letter-spacing:-.5px}
.section-title span{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px;box-shadow:0 7px 20px rgba(76,51,32,.045)}
.cat{display:inline-flex;align-items:center;min-height:28px;margin:6px 0 2px;padding:5px 9px;border-radius:999px;background:var(--yellow2);color:#6a511b;font-size:12px;font-weight:950}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid #efe4d6}
.item:last-child{border-bottom:0}
.item-name{font-size:17px;font-weight:900;color:#3a291f}
.price{font-size:14px;color:#8b715d;margin-top:4px;font-weight:750}
.qty{display:flex;align-items:center;gap:9px}
.qty button{width:40px;height:40px;border-radius:12px;border:1px solid #e1cfb8;background:#fffaf3;font-size:21px;color:#5d493a;font-weight:800;cursor:pointer}
.qty button:last-child{background:var(--yellow);border-color:#e9bf25;color:#493817}
.qty b{min-width:20px;text-align:center;font-size:16px}
label{display:block;font-size:14px;font-weight:950;color:#3d2c22;margin-bottom:8px}
textarea{width:100%;border:1px solid #dfccb4;background:#fffaf3;border-radius:14px;padding:12px 13px;font-size:16px;color:var(--ink);outline:none;resize:vertical}
textarea:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,138,61,.11)}
.payrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{border:0;border-radius:14px;min-height:50px;padding:12px 15px;font-size:15px;font-weight:950;cursor:pointer}
.pay{background:#fffaf3;border:1px solid #dfccb4;color:#5e4b3d}
.pay.active{background:#fff0b2;border:2px solid #e9b91f;color:#583f00;box-shadow:0 5px 14px rgba(233,185,31,.16)}
.tiny{font-size:12px;color:var(--muted);line-height:1.45}
.loading{padding:28px 4px;text-align:center;color:var(--muted)}
.sticky{position:fixed;left:0;right:0;bottom:0;padding:10px 12px max(10px,env(safe-area-inset-bottom));background:rgba(245,234,219,.9);backdrop-filter:blur(16px);border-top:1px solid rgba(68,44,27,.08);z-index:10}
.sticky-in{max-width:692px;margin:auto;background:linear-gradient(120deg,#39261d,#4b3023);color:#fff;border-radius:20px;padding:12px 12px 12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 10px 30px rgba(52,33,23,.28);border:1px solid rgba(255,255,255,.08)}
.metric{font-size:11px;color:#f4dfc9;font-weight:850;letter-spacing:.08em}
.total{font-size:30px;font-weight:950;color:var(--yellow);letter-spacing:-.5px;text-shadow:0 1px 0 rgba(0,0,0,.08)}
.submit{min-width:138px;background:linear-gradient(135deg,var(--yellow),#ffbe35);color:#3f2c0e;box-shadow:0 6px 16px rgba(255,202,55,.28)}
.submit:active{transform:translateY(1px)}
.done{text-align:center;padding:36px 20px}
.order-no{font-size:58px;font-weight:950;letter-spacing:1px;margin:10px 0;color:var(--orange)}
.done-total{font-size:29px;font-weight:950;color:var(--cocoa)}
.again{width:100%;background:var(--cocoa);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:420px){.wrap{padding-left:11px;padding-right:11px}.hero{padding:19px 17px}.brand{font-size:31px}.step-tip{display:none}.sticky{padding-left:9px;padding-right:9px}.total{font-size:27px}.submit{min-width:126px}}
</style>
</head>
<body>
<main id="root" class="wrap">
  <header class="hero">
    <div class="eyebrow">🍗 MOBILE ORDER</div>
    <div class="brand">炸雞店</div>
    <div class="sub">掃碼點餐・選擇用餐方式・確認餐點後送出訂單</div>
  </header>
  <div id="notice"></div>

  <section class="step-card">
    <div class="step-head"><span class="step-no">1</span><span class="step-title">選擇用餐方式</span><span class="step-tip">請先選擇</span></div>
    <div class="dining-switch" id="diningSwitch">
      <button type="button" class="dining-btn active" data-value="外帶">🛍️ 外帶</button>
      <button type="button" class="dining-btn" data-value="內用">🍽️ 內用</button>
    </div>
    <div class="table-box">
      <div class="table-label"><span class="table-title">桌號</span><span id="tableHint" class="table-note">外帶免填</span></div>
      <input id="tableNo" inputmode="numeric" placeholder="外帶不需要桌號" disabled>
    </div>
  </section>

  <div class="section-title"><b>本店菜單</b><span>點 ＋ 加入餐點</span></div>
  <section id="menu" class="card"><div class="loading">菜單載入中…</div></section>

  <section class="card"><label for="note">訂單備註</label><textarea id="note" rows="2" maxlength="120" placeholder="例如：不要辣、胡椒少一點"></textarea></section>

  <section class="card"><label>付款方式</label><div class="payrow"><button type="button" class="btn pay active" data-pay="現金">現金</button><button type="button" class="btn pay" data-pay="LINE Pay">LINE Pay</button></div><div class="tiny" style="margin-top:9px">測試版 LINE Pay 先以模擬付款完成處理。</div></section>
</main>

<div class="sticky"><div class="sticky-in"><div><div class="metric">ORDER TOTAL・應付金額</div><div id="total" class="total">$0</div></div><button id="submit" type="button" class="btn submit" disabled>送出訂單</button></div></div>

<script>
const REST='https://uuefhkqtslcdkdgeyiof.supabase.co/rest/v1/rpc';
const KEY='sb_publishable_v_Yzne9MJIj-9sjXYN-NDA_iA_u8wii';
let menu=[],cart={},pay='現金',dining='外帶',sending=false;
const $=s=>document.querySelector(s);
const money=n=>'$'+Number(n||0).toLocaleString('zh-TW');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function rpc(name,body){
  const r=await fetch(REST+'/'+name,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={message:t||'系統回應格式錯誤'}}
  if(!r.ok)throw new Error(d.message||d.error||'連線失敗');
  return d;
}
function showNotice(m,b=false){$('#notice').innerHTML=m?'<div class="notice'+(b?' bad':'')+'">'+esc(m)+'</div>':''}
function total(){return menu.reduce((s,x)=>s+Number(x.price||0)*(cart[x.id]||0),0)}
function updateBottom(){const t=total();$('#total').textContent=money(t);$('#submit').disabled=t<=0||sending}
function renderMenu(){
  const cats=[...new Set(menu.map(x=>x.category||'其他'))];
  $('#menu').innerHTML=cats.map(cat=>'<div class="cat">'+esc(cat)+'</div>'+menu.filter(x=>(x.category||'其他')===cat).map(x=>{const q=cart[x.id]||0;return '<div class="item"><div><div class="item-name">'+esc(x.name)+'</div><div class="price">'+money(x.price)+'</div></div><div class="qty"><button type="button" data-id="'+x.id+'" data-d="-1">−</button><b>'+q+'</b><button type="button" data-id="'+x.id+'" data-d="1">＋</button></div></div>'}).join('')).join('');
  updateBottom();
}
$('#menu').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(!b)return;const id=Number(b.dataset.id),d=Number(b.dataset.d);cart[id]=Math.max(0,(cart[id]||0)+d);renderMenu()});
$('#diningSwitch').addEventListener('click',e=>{
  const b=e.target.closest('.dining-btn');if(!b)return;
  dining=b.dataset.value;
  document.querySelectorAll('.dining-btn').forEach(x=>x.classList.toggle('active',x===b));
  const indoor=dining==='內用';
  $('#tableNo').disabled=!indoor;
  $('#tableNo').placeholder=indoor?'請輸入桌號，例如 3':'外帶不需要桌號';
  $('#tableHint').textContent=indoor?'內用請填桌號':'外帶免填';
  if(!indoor)$('#tableNo').value='';
  if(indoor)setTimeout(()=>$('#tableNo').focus(),80);
});
async function loadMenu(){try{const d=await rpc('smallshop_get_menu',{});menu=Array.isArray(d.menu)?d.menu:[];if(!menu.length)throw new Error('目前沒有可販售商品');renderMenu();showNotice('')}catch(e){$('#menu').innerHTML='<div class="loading" style="color:#b42318">菜單載入失敗</div>';showNotice('無法取得菜單，請重新整理頁面。',true)}}
document.querySelector('.payrow').addEventListener('click',e=>{const b=e.target.closest('.pay');if(!b)return;pay=b.dataset.pay;document.querySelectorAll('.pay').forEach(x=>x.classList.toggle('active',x===b))});
$('#submit').addEventListener('click',async()=>{
  if(sending)return;
  const items=menu.filter(x=>(cart[x.id]||0)>0).map(x=>({id:x.id,qty:cart[x.id]}));
  if(!items.length)return;
  if(dining==='內用'&&!$('#tableNo').value.trim()){
    showNotice('內用請先填寫桌號。',true);$('#tableNo').focus();return;
  }
  sending=true;updateBottom();$('#submit').textContent='送出中…';showNotice('');
  try{
    const d=await rpc('smallshop_create_order',{p_items:items,p_dining_type:dining,p_payment_method:pay,p_note:$('#note').value.trim(),p_table_no:$('#tableNo').value.trim()});
    const o=d.order;document.querySelector('.sticky').remove();
    $('#root').innerHTML='<section class="card done" style="margin-top:38px"><div class="eyebrow">ORDER CONFIRMED</div><div class="order-no">'+esc(o.order_no)+'</div><div class="done-total">'+money(o.total)+'</div><p class="sub">'+esc(o.dining_type)+(o.table_no?'・桌號 '+esc(o.table_no):'')+'・'+esc(o.payment_method)+'</p><p class="notice">請記住取餐號，店家會依序製作。</p><button id="again" type="button" class="btn again">繼續點餐</button></section>';
    $('#again').onclick=()=>location.reload();
  }catch(e){sending=false;$('#submit').textContent='送出訂單';updateBottom();showNotice(e.message||'訂單送出失敗',true)}
});
loadMenu();
</script>
</body>
</html>
