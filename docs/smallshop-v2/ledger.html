<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>阿財小吃｜營業流水帳</title><style>:root{--g:#245b37;--p:#eef6f0;--bg:#f6f7f4;--ink:#1d231e;--muted:#6f766f;--line:#e2e6e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}.wrap{max-width:860px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:3px 2px 14px}.brand{font-size:24px;font-weight:900}.sub{font-size:13px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:11px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{font-size:12px;color:var(--muted)}.big{font-size:26px;font-weight:950;margin-top:4px}.btn{border:0;border-radius:13px;padding:11px 14px;min-height:46px;font-size:15px;font-weight:850;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--g);color:#fff}.soft{background:var(--p);color:var(--g)}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filters input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.sec{font-size:16px;font-weight:900;margin:18px 2px 8px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:620px}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.table th{font-size:12px;color:var(--muted)}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eff2ef;font-size:12px;font-weight:800}.rank{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}.rank:last-child{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:24px}.hide{display:none}@media(min-width:760px){.metrics{grid-template-columns:repeat(6,1fr)}.filters{grid-template-columns:1fr 1fr auto auto}}</style></head><body><main class="wrap"><div class="top"><div><div class="brand">📒 營業流水帳</div><div class="sub">訂單完成收款後，自動計入營業額</div></div><a class="btn ghost" href="admin.html?pin=2468">返回接單</a></div><section class="card"><div class="filters"><div><div class="sub" style="margin-bottom:5px">開始日期</div><input id="from" type="date"></div><div><div class="sub" style="margin-bottom:5px">結束日期</div><input id="to" type="date"></div><button id="today" class="btn soft">今天</button><button id="month" class="btn soft">本月</button></div><div class="row" style="margin-top:10px"><button id="query" class="btn primary">查詢帳目</button><button id="csv" class="btn ghost">匯出 CSV</button></div></section><div id="error"></div><div id="app" class="hide"><div id="metrics" class="metrics"></div><div class="sec">每日營業摘要</div><section class="card tablewrap"><table class="table"><thead><tr><th>日期</th><th>訂單</th><th>營業額</th><th>現金</th><th>LINE Pay</th><th>未收款</th></tr></thead><tbody id="daily"></tbody></table></section><div class="sec">熱銷商品</div><section id="products" class="card"></section><div class="sec">訂單流水</div><section class="card tablewrap"><table class="table"><thead><tr><th>時間</th><th>訂單</th><th>餐點</th><th>金額</th><th>付款</th><th>收款</th><th>狀態</th></tr></thead><tbody id="orders"></tbody></table></section></div></main><script>const API='https://uuefhkqtslcdkdgeyiof.supabase.co/functions/v1/smallshop-v2';const $=s=>document.querySelector(s);const qs=new URLSearchParams(location.search);let pin=qs.get('pin')||'2468',last=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function twDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}function monthStart(d){return d.slice(0,8)+'01'}function money(n){return '$'+Number(n||0).toLocaleString('zh-TW')}function setToday(){const d=twDate();$('#from').value=d;$('#to').value=d}function setMonth(){const d=twDate();$('#from').value=monthStart(d);$('#to').value=d}async function load(){const from=$('#from').value,to=$('#to').value;if(!from||!to)return;$('#query').disabled=true;$('#query').textContent='讀取中…';$('#error').innerHTML='';try{const r=await fetch(API+'/api/ledger?from='+encodeURIComponent(from)+'&to='+encodeURIComponent(to),{headers:{'x-admin-pin':pin}});const d=await r.json();if(!r.ok)throw new Error(d.error||'讀取失敗');last=d;render(d)}catch(e){$('#app').classList.add('hide');$('#error').innerHTML='<section class="card" style="color:#a33232">'+esc(e.message)+'</section>'}finally{$('#query').disabled=false;$('#query').textContent='查詢帳目'}}function render(d){$('#app').classList.remove('hide');const m=d.metrics;$('#metrics').innerHTML='<section class="card"><div class="metric">營業額</div><div class="big">'+money(m.revenue)+'</div></section><section class="card"><div class="metric">訂單</div><div class="big">'+m.orders+'</div></section><section class="card"><div class="metric">平均客單</div><div class="big">'+money(m.average)+'</div></section><section class="card"><div class="metric">現金</div><div class="big">'+money(m.cash)+'</div></section><section class="card"><div class="metric">LINE Pay</div><div class="big">'+money(m.linepay)+'</div></section><section class="card"><div class="metric">未收款</div><div class="big">'+m.unpaid+'</div></section>';$('#daily').innerHTML=d.daily.length?d.daily.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+x.orders+'</td><td><b>'+money(x.revenue)+'</b></td><td>'+money(x.cash)+'</td><td>'+money(x.linepay)+'</td><td>'+x.unpaid+'</td></tr>').join(''):'<tr><td colspan="6" class="empty">沒有資料</td></tr>';$('#products').innerHTML=d.products.length?d.products.slice(0,20).map((x,i)=>'<div class="rank"><div><b>'+(i+1)+'. '+esc(x.name)+'</b></div><div>'+x.qty+' 份</div><div><b>'+money(x.amount)+'</b></div>').join(''):'<div class="empty">沒有商品銷售資料</div>';$('#orders').innerHTML=d.orders.length?d.orders.map(o=>'<tr><td>'+new Date(o.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+'</td><td><b>'+esc(o.order_no)+'</b></td><td>'+esc((o.items||[]).map(x=>x.name+'×'+x.qty).join('、'))+'</td><td><b>'+money(o.total)+'</b></td><td>'+esc(o.payment_method)+'</td><td>'+esc(o.payment_status)+'</td><td><span class="pill">'+esc(o.status)+'</span></td></tr>').join(''):'<tr><td colspan="7" class="empty">沒有訂單</td></tr>'}function exportCsv(){if(!last)return;const rows=[['時間','訂單','餐點','金額','付款方式','收款狀態','訂單狀態']];last.orders.forEach(o=>rows.push([new Date(o.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}),o.order_no,(o.items||[]).map(x=>x.name+' x'+x.qty).join('、'),o.total,o.payment_method,o.payment_status,o.status]));const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='營業流水帳_'+last.from+'_'+last.to+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('#today').onclick=()=>{setToday();load()};$('#month').onclick=()=>{setMonth();load()};$('#query').onclick=load;$('#csv').onclick=exportCsv;setToday();load();</script></body></html>
