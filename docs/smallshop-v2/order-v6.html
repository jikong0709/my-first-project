<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>炸雞店｜手機點餐</title>
<style>
:root{--bg:#f5f4f0;--card:#fff;--ink:#151515;--muted:#747474;--line:#e7e4de;--accent:#ff6b2c;--accent2:#fff0e8;--dark:#111;--bad:#b42318}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;padding:18px 16px 118px}.hero{padding:12px 2px 18px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}.brand{font-size:32px;line-height:1.1;font-weight:950;letter-spacing:-1.2px;margin-top:7px}.sub{font-size:13px;color:var(--muted);margin-top:7px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:11px;box-shadow:0 1px 0 rgba(0,0,0,.02)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;font-weight:850;color:#505050;margin-bottom:7px}select,input,textarea{width:100%;border:1px solid var(--line);background:#fbfbfa;border-radius:11px;padding:12px;font-size:16px;color:var(--ink);outline:none}select:focus,input:focus,textarea:focus{border-color:#bdb7ad;background:#fff}.section{font-size:18px;font-weight:950;letter-spacing:-.4px;margin:22px 2px 9px}.cat{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--muted);padding:8px 0 2px;text-transform:uppercase}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid #f0eee9}.item:last-child{border-bottom:0}.item-name{font-size:17px;font-weight:850}.price{font-size:14px;color:var(--muted);margin-top:4px}.qty{display:flex;align-items:center;gap:10px}.qty button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:21px;color:var(--ink);font-weight:700}.qty button:last-child{background:var(--dark);color:#fff;border-color:var(--dark)}.qty b{min-width:18px;text-align:center}.payrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:12px;min-height:48px;padding:12px 15px;font-size:15px;font-weight:900;cursor:pointer}.primary{background:var(--dark);color:#fff}.pay{background:#fff;border:1px solid var(--line);color:var(--ink)}.pay.active{background:var(--accent2);border:1px solid var(--accent);color:#9d3a10}.notice{border-radius:12px;padding:11px 12px;margin-bottom:11px;font-size:13px;background:#fff4ee;border:1px solid #ffd9c7;color:#8e3d17}.notice.bad{background:#fff1f0;border-color:#f6c7c3;color:var(--bad)}.loading{padding:28px 4px;text-align:center;color:var(--muted)}.sticky{position:fixed;left:0;right:0;bottom:0;padding:10px 14px max(10px,env(safe-area-inset-bottom));background:rgba(245,244,240,.88);backdrop-filter:blur(16px);border-top:1px solid rgba(0,0,0,.05);z-index:5}.sticky-in{max-width:692px;margin:auto;background:#111;color:#fff;border-radius:16px;padding:11px 12px 11px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.16)}.metric{font-size:11px;color:#bcbcbc}.total{font-size:25px;font-weight:950}.sticky .primary{background:var(--accent);min-width:130px}.done{text-align:center;padding:34px 20px}.order-no{font-size:58px;font-weight:950;letter-spacing:1px;margin:10px 0}.done-total{font-size:28px;font-weight:950}.tiny{font-size:12px;color:var(--muted)}button:disabled{opacity:.42;cursor:not-allowed}@media(max-width:420px){.wrap{padding-left:12px;padding-right:12px}.brand{font-size:29px}.grid2{gap:8px}.sticky{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<main id="root" class="wrap">
  <header class="hero"><div class="eyebrow">Mobile Order</div><div class="brand">炸雞店</div><div class="sub">掃碼點餐・送出後請留意取餐號</div></header>
  <div id="notice"></div>
  <section class="card"><div class="grid2"><div><label for="dining">用餐方式</label><select id="dining"><option value="外帶">外帶</option><option value="內用">內用</option></select></div><div><label for="tableNo">桌號（選填）</label><input id="tableNo" inputmode="numeric" placeholder="例如 3"></div></div></section>
  <div class="section">本店菜單</div>
  <section id="menu" class="card"><div class="loading">菜單載入中…</div></section>
  <section class="card"><label for="note">訂單備註</label><textarea id="note" rows="2" maxlength="120" placeholder="例如：不要辣、胡椒少一點"></textarea></section>
  <section class="card"><label>付款方式</label><div class="payrow"><button type="button" class="btn pay active" data-pay="現金">現金</button><button type="button" class="btn pay" data-pay="LINE Pay">LINE Pay</button></div><div class="tiny" style="margin-top:9px">測試版 LINE Pay 以模擬付款完成處理。</div></section>
</main>
<div class="sticky"><div class="sticky-in"><div><div class="metric">ORDER TOTAL</div><div id="total" class="total">$0</div></div><button id="submit" type="button" class="btn primary" disabled>送出訂單</button></div></div>
<script>
const REST='https://uuefhkqtslcdkdgeyiof.supabase.co/rest/v1/rpc';
const KEY='sb_publishable_v_Yzne9MJIj-9sjXYN-NDA_iA_u8wii';
let menu=[],cart={},pay='現金',sending=false;
const $=s=>document.querySelector(s),money=n=>'$'+Number(n||0).toLocaleString('zh-TW');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function rpc(name,body){const r=await fetch(REST+'/'+name,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={message:t||'系統回應格式錯誤'}}if(!r.ok)throw new Error(d.message||d.error||'連線失敗');return d}
function showNotice(m,b=false){$('#notice').innerHTML=m?'<div class="notice'+(b?' bad':'')+'">'+esc(m)+'</div>':''}
function total(){return menu.reduce((s,x)=>s+Number(x.price||0)*(cart[x.id]||0),0)}
function updateBottom(){const t=total();$('#total').textContent=money(t);$('#submit').disabled=t<=0||sending}
function renderMenu(){const cats=[...new Set(menu.map(x=>x.category||'其他'))];$('#menu').innerHTML=cats.map(cat=>'<div class="cat">'+esc(cat)+'</div>'+menu.filter(x=>(x.category||'其他')===cat).map(x=>{const q=cart[x.id]||0;return '<div class="item"><div><div class="item-name">'+esc(x.name)+'</div><div class="price">'+money(x.price)+'</div></div><div class="qty"><button type="button" data-id="'+x.id+'" data-d="-1">−</button><b>'+q+'</b><button type="button" data-id="'+x.id+'" data-d="1">＋</button></div></div>'}).join('')).join('');updateBottom()}
$('#menu').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(!b)return;const id=Number(b.dataset.id),d=Number(b.dataset.d);cart[id]=Math.max(0,(cart[id]||0)+d);renderMenu()});
async function loadMenu(){try{const d=await rpc('smallshop_get_menu',{});menu=Array.isArray(d.menu)?d.menu:[];if(!menu.length)throw new Error('目前沒有可販售商品');renderMenu();showNotice('')}catch(e){$('#menu').innerHTML='<div class="loading" style="color:#b42318">菜單載入失敗</div>';showNotice('無法取得菜單，請重新整理頁面。',true)}}
document.querySelector('.payrow').addEventListener('click',e=>{const b=e.target.closest('.pay');if(!b)return;pay=b.dataset.pay;document.querySelectorAll('.pay').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
$('#submit').addEventListener('click',async()=>{if(sending)return;const items=menu.filter(x=>(cart[x.id]||0)>0).map(x=>({id:x.id,qty:cart[x.id]}));if(!items.length)return;sending=true;updateBottom();$('#submit').textContent='送出中…';showNotice('');try{const d=await rpc('smallshop_create_order',{p_items:items,p_dining_type:$('#dining').value,p_payment_method:pay,p_note:$('#note').value.trim(),p_table_no:$('#tableNo').value.trim()});const o=d.order;document.querySelector('.sticky').remove();$('#root').innerHTML='<section class="card done" style="margin-top:38px"><div class="eyebrow">Order Confirmed</div><div class="order-no">'+esc(o.order_no)+'</div><div class="done-total">'+money(o.total)+'</div><p class="sub">'+esc(o.dining_type)+'・'+esc(o.payment_method)+'</p><p class="notice">請記住取餐號，店家會依序製作。</p><button id="again" type="button" class="btn primary" style="width:100%">繼續點餐</button></section>';$('#again').onclick=()=>location.reload()}catch(e){sending=false;$('#submit').textContent='送出訂單';updateBottom();showNotice(e.message||'訂單送出失敗',true)}});
loadMenu();
</script>
</body>
</html>
