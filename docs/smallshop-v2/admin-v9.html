Orders"></tbody></table></section></section></div></main><script>const REST='https://uuefhkqtslcdkdgeyiof.supabase.co/rest/v1/rpc',KEY='sb_publishable_v_Yzne9MJIj-9sjXYN-NDA_iA_u8wii';let pin='',timer=null,currentPane='orders',lastLedger=null,lastSig='',lock=false,updating=false;const $=s=>document.querySelector(s),money=n=>'$'+Number(n||0).toLocaleString('zh-TW'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function rpc(n,b){const r=await fetch(REST+'/'+n,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(b||{})}),t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={message:t}}if(!r.ok)throw new Error(d.message||d.error||'連線失敗');return d}function show(m,b=false){$('#status').innerHTML=m?'<div class="status'+(b?' bad':'')+'">'+esc(m)+'</div>':''}function twDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}function dayOf(v){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(v))}function fmt(v){const p=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date(v)),g=t=>p.find(x=>x.type===t)?.value||'';return g('year')+'-'+g('month')+'-'+g('day')+' '+g('hour')+':'+g('minute')+':'+g('second')}function setToday(){const d=twDate();$('#from').value=d;$('#to').value=d}function setMonth(){const d=twDate();$('#from').value=d.slice(0,8)+'01';$('#to').value=d}function pane(n){currentPane=n;const o=n==='orders';$('#ordersPane').classList.toggle('hide',!o);$('#ledgerPane').classList.toggle('hide',o);$('#tabOrders').className='btn tab '+(o?'active':'ghost');$('#tabLedger').className='btn tab '+(!o?'active':'ghost');show('');if(!o)loadLedger()}function metrics(a){const v=a.filter(o= catch(err){show(err.message||'更新失敗',true)}finally{updating=false;lock=false;poll()}});function summarize(a){const v=a.filter(o=>o.status!=='已取消'),p=v.filter(o=>o.payment_status==='已收款'),daily={},products={};v.forEach(o=>{const k=dayOf(o.created_at);daily[k]??={date:k,orders:0,revenue:0,cash:0,linepay:0,unpaid:0};daily[k].orders++;if(o.payment_status==='已收款'){daily[k].revenue+=Number(o.total||0);if(o.payment_method==='LINE Pay')daily[k].linepay+=Number(o.total||0);else daily[k].cash+=Number(o.total||0)}else daily[k].unpaid++;(o.items||[]).forEach(it=>{const n=it.name||'商品';products[n]??={name:n,qty:0,amount:0};products[n].qty+=Number(it.qty||0);products[n].amount+=Number(it.price||0)*Number(it.qty||0)})});const revenue=p.reduce((s,o)=>s+Number(o.total||0),0),cash=p.filter(o=>o.payment_method==='現金').reduce((s,o)=>s+Number(o.total||0),0),line=p.filter(o=>o.payment_method==='LINE Pay').reduce((s,o)=>s+Number(o.total||0),0);return{metrics:{revenue,cash,line,orders:v.length,unpaid:v.filter(o=>o.payment_status==='未收款').length},daily:Object.values(daily).sort((a,b)=>b.date.localeCompare(a.date)),products:Object.values(products).sort((a,b)=>b.qty-a.qty)}}async function loadLedger(){const from=$('#from').value,to=$('#to').value;if(!from||!to)return;$('#query').disabled=true;try{const d=await rpc('smallshop_ledger',{p_pin:pin,p_from:from,p_to:to}),a=Array.isArray(d.orders)?d.orders:[],s=summarize(a),m=s.metrics;lastLedger={from:d.from||from,to:d.to||to,orders:a};$('#ledgerMetrics').innerHTML='<section class="card metric-card"><div class="metric">營業額</div><div class="big">'+money(m.revenue)+'</div></section><section class="card metric-card"><div class="metric">訂單</div><div class="big">'+m.orders+'</div></section><section class="card metric-card"><div class="metric">現金</div><div class="big">'+money(m.cash)+'</div></section><section class="card metric-card"><div class="metric">LINE Pay</div><div class="big">'+money(m.line)+'</div></section>';$('#daily').innerHTML=s.daily.length?
