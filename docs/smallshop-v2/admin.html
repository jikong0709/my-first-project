<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>阿財小吃｜店家後台</title><style>:root{--g:#245b37;--p:#eef6f0;--bg:#f6f7f4;--ink:#1d231e;--muted:#6f766f;--line:#e2e6e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:3px 2px 14px}.brand{font-size:24px;font-weight:900}.sub{font-size:13px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:11px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{font-size:12px;color:var(--muted)}.big{font-size:27px;font-weight:950;margin-top:4px}.sec{font-size:16px;font-weight:900;margin:18px 2px 8px}.btn{border:0;border-radius:13px;padding:11px 14px;min-height:46px;font-size:15px;font-weight:850}.primary{background:var(--g);color:#fff}.soft{background:var(--p);color:var(--g)}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.order{border-left:5px solid var(--g)}.num{font-size:22px;font-weight:950}.pill{font-size:12px;font-weight:800;padding:5px 8px;border-radius:999px;background:#eff2ef}.items{margin:10px 0;font-weight:700;line-height:1.55}.note{background:#fff8e8;padding:9px 10px;border-radius:10px;font-size:13px;margin-top:8px}.hide{display:none}.gate input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:17px}.gate .row{display:grid;grid-template-columns:1fr auto}.empty{text-align:center;padding:28px;color:var(--muted)}@media(min-width:700px){.metrics{grid-template-columns:repeat(4,1fr)}}</style></head><body><main class="wrap"><div class="top"><div><div class="brand">接單後台</div><div class="sub">阿財小吃・手機 / 平板版</div></div><button id="refresh" class="btn ghost">更新</button></div><section id="gate" class="card gate"><div style="font-weight:850;margin-bottom:8px">店家管理 PIN</div><div class="row"><input id="pin" inputmode="numeric" value="2468"><button id="login" class="btn primary">進入</button></div><div class="sub" style="margin-top:7px">測試 PIN：2468</div></section><div id="app" class="hide"><div id="metrics" class="metrics"></div><div class="sec">即時訂單</div><div id="orders"></div></div></main><script>const API='https://uuefhkqtslcdkdgeyiof.supabase.co/functions/v1/smallshop-v2';let pin='2468',timer;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{let r=await fetch(API+'/api/orders',{headers:{'x-admin-pin':pin}});if(!r.ok){$('#gate').classList.remove('hide');$('#app').classList.add('hide');return}let d=await r.json();$('#gate').classList.add('hide');$('#app').classList.remove('hide');let m=d.metrics;$('#metrics').innerHTML='<section class="card"><div class="metric">今日營業額</div><div class="big">$'+m.revenue+'</div></section><section class="card"><div class="metric">今日訂單</div><div class="big">'+m.count+'</div></section><section class="card"><div class="metric">未收款</div><div class="big">'+m.unpaid+'</div></section><section class="card"><div class="metric">製作中</div><div class="big">'+m.making+'</div></section>';$('#orders').innerHTML=d.orders.length?d.orders.map(o=>'<section class="card order"><div class="row between"><div><span class="num">'+esc(o.order_no)+'</span> <span class="pill">'+esc(o.status)+'</span></div><b>$'+o.total+'</b></div><div class="items">'+o.items.map(x=>esc(x.name)+' ×'+x.qty).join('、')+'</div><div class="sub">'+esc(o.dining_type)+(o.table_no?'・桌 '+esc(o.table_no):'')+'・'+esc(o.payment_method)+'・'+esc(o.payment_status)+'・'+new Date(o.created_at).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})+'</div>'+(o.note?'<div class="note">備註：'+esc(o.note)+'</div>':'')+'<div class="row" style="margin-top:12px">'+(o.payment_status==='未收款'?'<button class="btn soft act" data-id="'+o.id+'" data-a="paid">確認收款</button>':'')+(o.status==='新訂單'?'<button class="btn primary act" data-id="'+o.id+'" data-a="making">開始製作</button>':'')+(o.status==='製作中'?'<button class="btn primary act" data-id="'+o.id+'" data-a="done">完成</button>':'')+'</div></section>').join(''):'<section class="card empty">目前沒有訂單。客人下單後會自動出現在這裡。</section>';document.querySelectorAll('.act').forEach(b=>b.onclick=async()=>{b.disabled=true;await fetch(API+'/api/orders/'+b.dataset.id,{method:'PATCH',headers:{'content-type':'application/json','x-admin-pin':pin},body:JSON.stringify({action:b.dataset.a})});load()})}catch(e){$('#orders').innerHTML='<section class="card empty">後台連線失敗，請按更新重試。</section>'}}$('#login').onclick=()=>{pin=$('#pin').value.trim();load();clearInterval(timer);timer=setInterval(load,2500)};$('#refresh').onclick=load;load();timer=setInterval(load,2500);</script></body></html>
