<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4e8d4"><title>炸雞店｜手機點餐</title><style>:root{--bg:#f7f1e7;--tea:#e9d7bd;--tea2:#d8bea0;--yellow:#f6cd54;--yellow2:#fff3bd;--ink:#29251f;--muted:#817665;--card:#fffdf9;--line:#e8ddcd;--bad:#a83a32}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}.wrap{max-width:720px;margin:auto;padding:18px 16px 118px}.hero{padding:13px 2px 20px}.eyebrow{display:inline-flex;background:var(--yellow2);padding:6px 9px;border-radius:999px;font-size:11px;font-weight:900;letter-spacing:.09em}.brand{font-size:33px;font-weight:950;letter-spacing:-1.3px;margin-top:11px}.sub{font-size:13px;color:var(--muted);margin-top:5px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 5px 20px rgba(78,59,34,.035)}.grid2,.payrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;font-weight:900;margin-bottom:7px;color:#615747}select,input,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:16px;color:var(--ink);outline:none}select:focus,input:focus,textarea:focus{border-color:var(--tea2);box-shadow:0 0 0 3px rgba(216,190,160,.16)}.section{font-size:18px;font-weight:950;margin:22px 2px 9px}.cat{font-size:12px;font-weight:950;color:#8d795d;padding:9px 0 2px}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:15px 0;border-bottom:1px solid #f0e8dd}.item:last-child{border-bottom:0}.item-name{font-size:17px;font-weight:900}.price{font-size:14px;color:var(--muted);margin-top:3px}.qty{display:flex;align-items:center;gap:9px}.qty button{width:39px;height:39px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:21px;font-weight:850;color:var(--ink)}.qty button:last-child{background:var(--yellow);border-color:var(--yellow)}.qty b{min-width:18px;text-align:center}.btn{border:0;border-radius:13px;min-height:49px;padding:12px 15px;font-size:15px;font-weight:950;cursor:pointer}.pay{background:#fff;border:1px solid var(--line)}.pay.active{background:var(--yellow2);border:1px solid #edc750}.primary{background:var(--yellow);color:#332b19}.notice{border-radius:12px;padding:11px 12px;margin-bottom:11px;font-size:13px;background:#fff8dc;border:1px solid #f1dc8d;color:#68551c}.notice.bad{background:#fff0ee;border-color:#efcac5;color:var(--bad)}.loading{text-align:center;padding:28px;color:var(--muted)}.tiny{font-size:12px;color:var(--muted)}.sticky{position:fixed;left:0;right:0;bottom:0;padding:10px 14px max(10px,env(safe-area-inset-bottom));background:rgba(247,241,231,.88);backdrop-filter:blur(16px);border-top:1px solid rgba(80,60,30,.06);z-index:5}.sticky-in{max-width:692px;margin:auto;background:#4f4335;color:#fff;border-radius:17px;padding:11px 12px 11px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;box-shadow:0 12px 34px rgba(64,48,30,.18)}.metric{font-size:11px;color:#ddcfbe}.total{font-size:26px;font-weight:950}.sticky .primary{min-width:132px}.done{text-align:center;padding:36px 20px}.order-no{font-size:58px;font-weight:950;margin:10px 0}.done-total{font-size:29px;font-weight:950}button:disabled{opacity:.45}@media(max-width:420px){.wrap{padding-left:12px;padding-right:12px}.brand{font-size:30px}.grid2{gap:8px}.sticky{padding-left:10px;padding-right:10px}}</style></head><body><main id="root" class="wrap"><header class="hero"><div class="eyebrow">MOBILE ORDER</div><div class="brand">炸雞店</div><div class="sub">掃碼點餐・送出後請留意取餐號</div></header><div id="notice"></div><section class="card"><div class="grid2"><div><label>用餐方式</label><select id="dining"><option value="外帶">外帶</option><option value="內用">內用</option></select></div><div><label>桌號（選填）</label><input id="tableNo" inputmode="numeric" placeholder="例如 3"></div></div></section><div class="section">菜單</div><section id="menu" class="card"><div class="loading">菜單載入中…</div></section><section class="card"><label>訂單備註</label><textarea id="note" rows="2" maxlength="120" placeholder="例如：不要辣、胡椒少一點"></textarea></section><section class="card"><label>付款方式</label><div class="payrow"><button class="btn pay active" data-pay="現金">現金</button><button class="btn pay" data-pay="LINE Pay">LINE Pay</button></div><div class="tiny" style="margin-top:9px">測試版 LINE Pay 以模擬付款完成處理。</div></section></main><div class="sticky"><div class="sticky-in"><div><div class="metric">ORDER TOTAL</div><div id="total" class="total">$0</div></div><button id="submit" class="btn primary" disabled>送出訂單</button></div></div><script>const REST='https://uuefhkqtslcdkdgeyiof.supabase.co/rest/v1/rpc',KEY='sb_publishable_v_Yzne9MJIj-9sjXYN-NDA_iA_u8wii';let menu=[],cart={},pay='現金',sending=false;const $=s=>document.querySelector(s),money=n=>'$'+Number(n||0).toLocaleString('zh-TW'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function rpc(n,b){const r=await fetch(REST+'/'+n,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(b||{})}),t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={message:t}}if(!r.ok)throw new Error(d.message||d.error||'連線失敗');return d}function notice(m,b=false){$('#notice').innerHTML=m?'<div class="notice'+(b?' bad':'')+'">'+esc(m)+'</div>':''}function total(){return menu.reduce((s,x)=>s+Number(x.price||0)*(cart[x.id]||0),0)}function bottom(){const t=total();$('#total').textContent=money(t);$('#submit').disabled=t<=0||sending}function render(){const cats=[...new Set(menu.map(x=>x.category||'其他'))];$('#menu').innerHTML=cats.map(cat=>'<div class="cat">'+esc(cat)+'</div>'+menu.filter(x=>(x.category||'其他')===cat).map(x=>{const q=cart[x.id]||0;return '<div class="item"><div><div class="item-name">'+esc(x.name)+'</div><div class="price">'+money(x.price)+'</div></div><div class="qty"><button data-id="'+x.id+'" data-d="-1">−</button><b>'+q+'</b><button data-id="'+x.id+'" data-d="1">＋</button></div></div>'}).join('')).join('');bottom()}$('#menu').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(!b)return;const id=Number(b.dataset.id);cart[id]=Math.max(0,(cart[id]||0)+Number(b.dataset.d));render()});document.querySelector('.payrow').addEventListener('click',e=>{const b=e.target.closest('.pay');if(!b)return;pay=b.dataset.pay;document.querySelectorAll('.pay').forEach(x=>x.classList.remove('active'));b.classList.add('active')});async function loadMenu(){try{const d=await rpc('smallshop_get_menu',{});menu=Array.isArray(d.menu)?d.menu:[];if(!menu.length)throw new Error();render();notice('')}catch{$('#menu').innerHTML='<div class="loading">菜單載入失敗</div>';notice('無法取得菜單，請重新整理頁面。',true)}}$('#submit').addEventListener('click',async()=>{if(sending)return;const items=menu.filter(x=>(cart[x.id]||0)>0).map(x=>({id:x.id,qty:cart[x.id]}));if(!items.length)return;sending=true;bottom();$('#submit').textContent='送出中…';try{const d=await rpc('smallshop_create_order',{p_items:items,p_dining_type:$('#dining').value,p_payment_method:pay,p_note:$('#note').value.trim(),p_table_no:$('#tableNo').value.trim()}),o=d.order;document.querySelector('.sticky').remove();$('#root').innerHTML='<section class="card done" style="margin-top:38px"><div class="eyebrow">ORDER CONFIRMED</div><div class="order-no">'+esc(o.order_no)+'</div><div class="done-total">'+money(o.total)+'</div><p class="sub">'+esc(o.dining_type)+'・'+esc(o.payment_method)+'</p><p class="notice">請記住取餐號，店家會依序製作。</p><button id="again" class="btn primary" style="width:100%">繼續點餐</button></section>';$('#again').onclick=()=>location.reload()}catch(e){sending=false;$('#submit').textContent='送出訂單';bottom();notice(e.message||'訂單送出失敗',true)}});loadMenu();</script></body></html>
