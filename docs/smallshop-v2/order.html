<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>阿財小吃｜手機點餐</title><style>:root{--g:#245b37;--p:#eef6f0;--bg:#f7f7f3;--ink:#1e241f;--muted:#717871;--line:#e3e7e2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}.wrap{max-width:640px;margin:auto;padding:18px 14px 120px}.head{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 18px}.brand{font-size:24px;font-weight:900}.sub{font-size:13px;color:var(--muted)}.pill{background:var(--p);color:var(--g);padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}select,input,textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px;font-size:16px;background:#fff}.sec{font-size:16px;font-weight:900;margin:18px 2px 9px}.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:14px 0;border-bottom:1px dashed var(--line)}.item:last-child{border-bottom:0}.name{font-weight:800}.price{font-size:13px;color:var(--muted);margin-top:3px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:40px;height:40px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:21px}.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{min-height:48px;border:0;border-radius:14px;padding:12px;font-size:16px;font-weight:850}.primary{background:var(--g);color:#fff}.soft{background:var(--p);color:var(--g)}.ghost{background:#fff;border:1px solid var(--line)}.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}.barin{max-width:612px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}.total{font-size:25px;font-weight:950}.mini{font-size:12px;color:var(--muted)}button:disabled{opacity:.45}.success{text-align:center;padding:36px 18px}.num{font-size:52px;font-weight:950;color:var(--g);margin:10px}.err{background:#fff0f0;color:#9b3030;border-radius:12px;padding:10px;margin-bottom:10px;font-size:13px}@media(max-width:380px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="head"><div><div class="brand">阿財小吃</div><div class="sub">掃碼點餐・測試店</div></div><span class="pill">營業中</span></div><div id="msg"></div><section class="card"><div class="grid"><div><label>用餐方式</label><select id="dining"><option>外帶</option><option>內用</option></select></div><div><label>桌號（選填）</label><input id="table" placeholder="例如 3"></div></div></section><div class="sec">菜單</div><section id="menu" class="card"><div class="sub">菜單載入中…</div></section><section class="card"><label>備註</label><textarea id="note" rows="2" placeholder="例如：不要辣、醬少一點"></textarea><div style="height:12px"></div><label>付款方式</label><div class="pay"><button type="button" class="btn soft paybtn" data-pay="現金">現金</button><button type="button" class="btn ghost paybtn" data-pay="LINE Pay">LINE Pay</button></div></section></main><div class="bar"><div class="barin"><div><div class="mini">目前合計</div><div id="total" class="total">$0</div></div><button id="submit" class="btn primary" disabled>送出訂單</button></div></div><script>const API='https://uuefhkqtslcdkdgeyiof.supabase.co/functions/v1/smallshop-v2';let menu=[],cart={},pay='現金';const $=s=>document.querySelector(s);function render(){let cats=[...new Set(menu.map(x=>x.category))];$('#menu').innerHTML=cats.map(c=>'<div class="sec" style="margin-top:4px">'+c+'</div>'+menu.filter(x=>x.category===c).map(x=>{let q=cart[x.id]||0;return '<div class="item"><div><div class="name">'+x.name+'</div><div class="price">$'+x.price+'</div></div><div class="qty"><button type="button" data-id="'+x.id+'" data-d="-1">−</button><b>'+q+'</b><button type="button" data-id="'+x.id+'" data-d="1">＋</button></div></div>'}).join('')).join('');$('#menu').querySelectorAll('button').forEach(b=>b.onclick=()=>{let id=+b.dataset.id;cart[id]=Math.max(0,(cart[id]||0)+(+b.dataset.d));render()});let t=menu.reduce((s,x)=>s+x.price*(cart[x.id]||0),0);$('#total').textContent='$'+t;$('#submit').disabled=t===0}fetch(API+'/api/menu').then(r=>r.json()).then(d=>{menu=d.menu||[];render()}).catch(()=>$('#menu').innerHTML='<div class="err">菜單載入失敗，請重新整理。</div>');document.querySelectorAll('.paybtn').forEach(b=>b.onclick=()=>{pay=b.dataset.pay;document.querySelectorAll('.paybtn').forEach(x=>x.className='btn ghost paybtn');b.className='btn soft paybtn'});$('#submit').onclick=async()=>{let items=menu.filter(x=>(cart[x.id]||0)>0).map(x=>({id:x.id,qty:cart[x.id]}));let b=$('#submit');b.disabled=true;b.textContent='送出中…';try{let r=await fetch(API+'/api/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({items,dining_type:$('#dining').value,payment_method:pay,note:$('#note').value,table_no:$('#table').value})});let d=await r.json();if(!r.ok)throw Error(d.error||'送出失敗');document.body.innerHTML='<main class="wrap"><section class="card success"><div class="sub">訂單已送出</div><div class="num">'+d.order.order_no+'</div><div class="total">$'+d.order.total+'</div><p class="sub">'+d.order.dining_type+'・'+d.order.payment_method+'</p><button class="btn primary" onclick="location.reload()">再點一單</button></section></main>'}catch(e){b.disabled=false;b.textContent='送出訂單';$('#msg').innerHTML='<div class="err">'+e.message+'</div>'}};</script></body></html>
