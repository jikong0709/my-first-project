<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>阿財小吃｜店家後台 V3</title>
<style>
:root{--g:#245b37;--p:#eef6f0;--bg:#f6f7f4;--ink:#1d231e;--muted:#6f766f;--line:#e2e6e1;--warn:#9a6a17;--bad:#a33232}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}.wrap{max-width:880px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 2px 14px}.brand{font-size:24px;font-weight:900}.sub{font-size:13px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:11px}.btn{border:0;border-radius:13px;padding:11px 14px;min-height:46px;font-size:15px;font-weight:850;cursor:pointer}.primary{background:var(--g);color:#fff}.soft{background:var(--p);color:var(--g)}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.tab.active{background:var(--g);color:#fff}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{font-size:12px;color:var(--muted)}.big{font-size:27px;font-weight:950;margin-top:4px}.sec{font-size:16px;font-weight:900;margin:18px 2px 8px}.order{border-left:5px solid var(--g)}.num{font-size:22px;font-weight:950}.pill{font-size:12px;font-weight:800;padding:5px 8px;border-radius:999px;background:#eff2ef}.items{margin:10px 0;font-weight:700;line-height:1.55}.note{background:#fff8e8;padding:9px 10px;border-radius:10px;font-size:13px;margin-top:8px}.hide{display:none!important}.gate input,.filters input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}.gate .row{display:grid;grid-template-columns:1fr auto}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{text-align:center;padding:26px;color:var(--muted)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:620px}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.table th{font-size:12px;color:var(--muted)}.rank{display:grid;grid-template-columns:1fr auto auto;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}.rank:last-child{border-bottom:0}.status{padding:10px 12px;border-radius:12px;margin-bottom:10px;background:#eef6f0;color:var(--g);font-size:13px}.status.bad{background:#fff0f0;color:var(--bad)}@media(min-width:760px){.metrics{grid-template-columns:repeat(6,1fr)}.filters{grid-template-columns:1fr 1fr auto auto}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><div><div class="brand">阿財小吃｜店家後台</div><div class="sub">手機 / 平板直接使用</div></div><button id="refresh" type="button" class="btn ghost">更新</button></div>
  <section id="gate" class="card gate"><div style="font-weight:850;margin-bottom:8px">店家管理 PIN</div><div class="row"><input id="pin" inputmode="numeric" value="2468"><button id="login" type="button" class="btn primary">進入</button></div><div class="sub" style="margin-top:7px">測試 PIN：2468</div></section>
  <div id="app" class="hide">
    <div class="tabs"><button id="tabOrders" type="button" class="btn tab active">即時接單</button><button id="tabLedger" type="button" class="btn tab ghost">營業流水帳</button></div>
    <div id="status"></div>
    <section id="ordersPane">
      <div id="orderMetrics" class="metrics"></div>
      <div class="sec">即時訂單</div><div id="orders"></div>
    </section>
    <section id="ledgerPane" class="hide">
      <div class="card"><div class="filters"><div><div class="sub" style="margin-bottom:5px">開始日期</div><input id="from" type="date"></div><div><div class="sub" style="margin-bottom:5px">結束日期</div><input id="to" type="date"></div><button id="today" type="button" class="btn soft">今天</button><button id="month" type="button" class="btn soft">本月</button></div><div class="row" style="margin-top:10px"><button id="query" type="button" class="btn primary">查詢帳目</button><button id="csv" type="button" class="btn ghost">匯出 CSV</button></div></div>
      <div id="ledgerMetrics" class="metrics"></div>
      <div class="sec">每日營業摘要</div><section class="card tablewrap"><table class="table"><thead><tr><th>日期</th><th>訂單</th><th>營業額</th><th>現金</th><th>LINE Pay</th><th>未收款</th></tr></thead><tbody id="daily"></tbody></table></section>
      <div class="sec">熱銷商品</div><section id="products" class="card"></section>
      <div class="sec">訂單流水</div><section class="card tablewrap"><table class="table"><thead><tr><th>時間</th><th>訂單</th><th>餐點</th><th>金額</th><th>付款</th><th>收款</th><th>狀態</th></tr></thead><tbody id="ledgerOrders"></tbody></table></section>
    </section>
  </div>
</main>
<script>
const API='https://uuefhkqtslcdkdgeyiof.supabase.co/functions/v1/smallshop-v2';
let pin='2468',timer=null,lastLedger=null,currentPane='orders';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('zh-TW');
function showStatus(msg,bad=false){$('#status').innerHTML=msg?'<div class="status'+(bad?' bad':'')+'">'+esc(msg)+'</div>':'';}
function twDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function monthStart(d){return d.slice(0,8)+'01'}
function setToday(){const d=twDate();$('#from').value=d;$('#to').value=d}
function setMonth(){const d=twDate();$('#from').value=monthStart(d);$('#to').value=d}
function setPane(name){currentPane=name;const orders=name==='orders';$('#ordersPane').classList.toggle('hide',!orders);$('#ledgerPane').classList.toggle('hide',orders);$('#tabOrders').className='btn tab '+(orders?'active':'ghost');$('#tabLedger').className='btn tab '+(!orders?'active':'ghost');if(!orders)loadLedger();}
async function loadOrders(){try{const r=await fetch(API+'/api/orders',{headers:{'x-admin-pin':pin}});const d=await r.json();if(!r.ok)throw new Error(d.error||'讀取訂單失敗');$('#gate').classList.add('hide');$('#app').classList.remove('hide');showStatus('');const m=d.metrics;$('#orderMetrics').innerHTML='<section class="card"><div class="metric">今日營業額</div><div class="big">'+money(m.revenue)+'</div></section><section class="card"><div class="metric">今日訂單</div><div class="big">'+m.count+'</div></section><section class="card"><div class="metric">未收款</div><div class="big">'+m.unpaid+'</div></section><section class="card"><div class="metric">製作中</div><div class="big">'+m.making+'</div></section>';$('#orders').innerHTML=d.orders.length?d.orders.map(o=>'<section class="card order"><div class="row between"><div><span class="num">'+esc(o.order_no)+'</span> <span class="pill">'+esc(o.status)+'</span></div><b>'+money(o.total)+'</b></div><div class="items">'+(o.items||[]).map(x=>esc(x.name)+' ×'+x.qty).join('、')+'</div><div class="sub">'+esc(o.dining_type)+(o.table_no?'・桌 '+esc(o.table_no):'')+'・'+esc(o.payment_method)+'・'+esc(o.payment_status)+'・'+new Date(o.created_at).toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit'})+'</div>'+(o.note?'<div class="note">備註：'+esc(o.note)+'</div>':'')+'<div class="row" style="margin-top:12px">'+(o.payment_status==='未收款'?'<button type="button" class="btn soft act" data-id="'+o.id+'" data-a="paid">確認收款</button>':'')+(o.status==='新訂單'?'<button type="button" class="btn primary act" data-id="'+o.id+'" data-a="making">開始製作</button>':'')+(o.status==='製作中'?'<button type="button" class="btn primary act" data-id="'+o.id+'" data-a="done">完成</button>':'')+'</div></section>').join(''):'<section class="card empty">目前沒有訂單。</section>';document.querySelectorAll('.act').forEach(b=>b.addEventListener('click',async()=>{b.disabled=true;try{const r=await fetch(API+'/api/orders/'+b.dataset.id,{method:'PATCH',headers:{'content-type':'application/json','x-admin-pin':pin},body:JSON.stringify({action:b.dataset.a})});const d=await r.json();if(!r.ok)throw new Error(d.error||'更新失敗');await loadOrders();if(currentPane==='ledger')await loadLedger();}catch(e){showStatus(e.message,true);b.disabled=false;}}));}catch(e){$('#gate').classList.remove('hide');$('#app').classList.add('hide');showStatus(e.message,true)}}
async function loadLedger(){const from=$('#from').value,to=$('#to').value;if(!from||!to)return;$('#query').disabled=true;$('#query').textContent='讀取中…';try{const r=await fetch(API+'/api/ledger?from='+encodeURIComponent(from)+'&to='+encodeURIComponent(to),{headers:{'x-admin-pin':pin}});const d=await r.json();if(!r.ok)throw new Error(d.error||'讀取帳目失敗');lastLedger=d;showStatus('');const m=d.metrics;$('#ledgerMetrics').innerHTML='<section class="card"><div class="metric">營業額</div><div class="big">'+money(m.revenue)+'</div></section><section class="card"><div class="metric">訂單</div><div class="big">'+m.orders+'</div></section><section class="card"><div class="metric">平均客單</div><div class="big">'+money(m.average)+'</div></section><section class="card"><div class="metric">現金</div><div class="big">'+money(m.cash)+'</div></section><section class="card"><div class="metric">LINE Pay</div><div class="big">'+money(m.linepay)+'</div></section><section class="card"><div class="metric">未收款</div><div class="big">'+m.unpaid+'</div></section>';$('#daily').innerHTML=d.daily.length?d.daily.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+x.orders+'</td><td><b>'+money(x.revenue)+'</b></td><td>'+money(x.cash)+'</td><td>'+money(x.linepay)+'</td><td>'+x.unpaid+'</td></tr>').join(''):'<tr><td colspan="6" class="empty">沒有資料</td></tr>';$('#products').innerHTML=d.products.length?d.products.slice(0,20).map((x,i)=>'<div class="rank"><div><b>'+(i+1)+'. '+esc(x.name)+'</b></div><div>'+x.qty+' 份</div><div><b>'+money(x.amount)+'</b></div></div>').join(''):'<div class="empty">沒有商品銷售資料</div>';$('#ledgerOrders').innerHTML=d.orders.length?d.orders.map(o=>'<tr><td>'+new Date(o.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+'</td><td><b>'+esc(o.order_no)+'</b></td><td>'+esc((o.items||[]).map(x=>x.name+'×'+x.qty).join('、'))+'</td><td><b>'+money(o.total)+'</b></td><td>'+esc(o.payment_method)+'</td><td>'+esc(o.payment_status)+'</td><td><span class="pill">'+esc(o.status)+'</span></td></tr>').join(''):'<tr><td colspan="7" class="empty">沒有訂單</td></tr>';}catch(e){showStatus(e.message,true)}finally{$('#query').disabled=false;$('#query').textContent='查詢帳目'}}
function exportCsv(){if(!lastLedger){showStatus('請先查詢帳目',true);return}const rows=[['時間','訂單','餐點','金額','付款方式','收款狀態','訂單狀態']];lastLedger.orders.forEach(o=>rows.push([new Date(o.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}),o.order_no,(o.items||[]).map(x=>x.name+' x'+x.qty).join('、'),o.total,o.payment_method,o.payment_status,o.status]));const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='營業流水帳_'+lastLedger.from+'_'+lastLedger.to+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#login').addEventListener('click',()=>{pin=$('#pin').value.trim();loadOrders();clearInterval(timer);timer=setInterval(()=>{if(currentPane==='orders')loadOrders()},2500)});
$('#refresh').addEventListener('click',()=>currentPane==='orders'?loadOrders():loadLedger());
$('#tabOrders').addEventListener('click',()=>setPane('orders'));
$('#tabLedger').addEventListener('click',()=>setPane('ledger'));
$('#today').addEventListener('click',()=>{setToday();loadLedger()});
$('#month').addEventListener('click',()=>{setMonth();loadLedger()});
$('#query').addEventListener('click',loadLedger);
$('#csv').addEventListener('click',exportCsv);
setToday();loadOrders();timer=setInterval(()=>{if(currentPane==='orders')loadOrders()},2500);
</script>
</body>
</html>
