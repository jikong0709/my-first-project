<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#245b37">
<title>阿財小吃｜店家後台 V4</title>
<style>
:root{--g:#245b37;--g2:#e9f3ec;--bg:#f6f7f4;--card:#fff;--ink:#1d231e;--muted:#717871;--line:#e1e6e1;--bad:#a33232;--warn:#946414}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 14px}.brand{font-size:25px;font-weight:950}.sub{font-size:13px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:11px}.btn{border:0;border-radius:13px;min-height:46px;padding:11px 14px;font-size:15px;font-weight:900;cursor:pointer}.primary{background:var(--g);color:#fff}.soft{background:var(--g2);color:var(--g)}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff0f0;color:var(--bad);border:1px solid #efcaca}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.gate .row{display:grid;grid-template-columns:1fr auto}.gate input,.filters input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.tab.active{background:var(--g);color:#fff;border-color:var(--g)}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{font-size:12px;color:var(--muted)}.big{font-size:27px;font-weight:950;margin-top:4px}.sec{font-size:16px;font-weight:950;margin:18px 2px 8px}.order{border-left:5px solid var(--g)}.num{font-size:23px;font-weight:950}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:#eff2ef;font-size:12px;font-weight:850}.items{font-weight:750;line-height:1.55;margin:10px 0}.note{background:#fff8e8;border-radius:10px;padding:9px 10px;font-size:13px;margin-top:8px}.status{padding:10px 12px;border-radius:12px;margin-bottom:10px;background:#eef6f0;color:var(--g);font-size:13px}.status.bad{background:#fff0f0;color:var(--bad)}.hide{display:none!important}.empty{text-align:center;padding:28px;color:var(--muted)}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}.table th{font-size:12px;color:var(--muted)}.rank{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}.rank:last-child{border-bottom:0}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.tiny{font-size:12px;color:var(--muted)}button:disabled{opacity:.45;cursor:not-allowed}@media(min-width:760px){.metrics{grid-template-columns:repeat(6,1fr)}.filters{grid-template-columns:1fr 1fr auto auto}}@media(max-width:440px){.wrap{padding:12px}.brand{font-size:23px}.top{align-items:flex-start}.top-actions .btn{min-height:42px;padding:9px 11px}.table{min-width:620px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="top"><div><div class="brand">阿財小吃｜店家後台</div><div class="sub">手機 / 平板直接接單</div></div><div class="top-actions"><button id="refresh" type="button" class="btn ghost">更新</button></div></div>
  <section id="gate" class="card gate"><div style="font-weight:900;margin-bottom:8px">店家管理 PIN</div><div class="row"><input id="pin" inputmode="numeric" value="2468" aria-label="店家管理 PIN"><button id="login" type="button" class="btn primary">進入</button></div><div class="tiny" style="margin-top:7px">測試 PIN：2468</div></section>
  <div id="app" class="hide">
    <div class="tabs"><button id="tabOrders" type="button" class="btn tab active">即時接單</button><button id="tabLedger" type="button" class="btn tab ghost">營業流水帳</button></div>
    <div id="status"></div>
    <section id="ordersPane">
      <div id="orderMetrics" class="metrics"></div>
      <div class="sec">即時訂單</div>
      <div id="orders"></div>
    </section>
    <section id="ledgerPane" class="hide">
      <section class="card"><div class="filters"><div><div class="tiny" style="margin-bottom:5px">開始日期</div><input id="from" type="date"></div><div><div class="tiny" style="margin-bottom:5px">結束日期</div><input id="to" type="date"></div><button id="today" type="button" class="btn soft">今天</button><button id="month" type="button" class="btn soft">本月</button></div><div class="row" style="margin-top:10px"><button id="query" type="button" class="btn primary">查詢帳目</button><button id="csv" type="button" class="btn ghost">匯出 CSV（Excel相容）</button></div></section>
      <div id="ledgerMetrics" class="metrics"></div>
      <div class="sec">每日營業摘要</div>
      <section class="card tablewrap"><table class="table"><thead><tr><th>日期</th><th>訂單</th><th>營業額</th><th>現金</th><th>LINE Pay</th><th>未收款</th></tr></thead><tbody id="daily"></tbody></table></section>
      <div class="sec">熱銷商品</div><section id="products" class="card"></section>
      <div class="sec">訂單流水</div>
      <section class="card tablewrap"><table class="table"><thead><tr><th>時間</th><th>訂單</th><th>餐點</th><th>金額</th><th>付款</th><th>收款</th><th>狀態</th></tr></thead><tbody id="ledgerOrders"></tbody></table></section>
    </section>
  </div>
</main>
<script>
const REST='https://uuefhkqtslcdkdgeyiof.supabase.co/rest/v1/rpc';
const KEY='sb_publishable_v_Yzne9MJIj-9sjXYN-NDA_iA_u8wii';
let pin='2468',timer=null,currentPane='orders',lastLedger=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('zh-TW');
async function rpc(name,body){
  const r=await fetch(REST+'/'+name,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  const text=await r.text();let data={};try{data=text?JSON.parse(text):{}}catch{data={message:text||'系統回應格式錯誤'}}
  if(!r.ok)throw new Error(data.message||data.error||'連線失敗');
  return data;
}
function showStatus(msg,bad=false){$('#status').innerHTML=msg?'<div class="status'+(bad?' bad':'')+'">'+esc(msg)+'</div>':'';}
function twDate(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function dayOf(v){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(v))}
function monthStart(d){return d.slice(0,8)+'01'}
function setToday(){const d=twDate();$('#from').value=d;$('#to').value=d}
function setMonth(){const d=twDate();$('#from').value=monthStart(d);$('#to').value=d}
function computeOrderMetrics(orders){const valid=orders.filter(o=>o.status!=='已取消');return{revenue:valid.filter(o=>o.payment_status==='已收款').reduce((s,o)=>s+Number(o.total||0),0),count:valid.length,unpaid:valid.filter(o=>o.payment_status==='未收款').length,making:valid.filter(o=>o.status==='製作中').length}}
function setPane(name){currentPane=name;const isOrders=name==='orders';$('#ordersPane').classList.toggle('hide',!isOrders);$('#ledgerPane').classList.toggle('hide',isOrders);$('#tabOrders').className='btn tab '+(isOrders?'active':'ghost');$('#tabLedger').className='btn tab '+(!isOrders?'active':'ghost');showStatus('');if(!isOrders)loadLedger()}
function receiptHtml(o){const rows=(o.items||[]).map(x=>'<div class="r"><span>'+esc(x.name)+' ×'+x.qty+'</span><span>'+money(Number(x.price||0)*Number(x.qty||0))+'</span></div>').join('');return '<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(o.order_no)+'</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;width:72mm;max-width:100%;margin:0 auto;padding:5mm;color:#111}.c{text-align:center}.b{font-size:24px;font-weight:900}.line{border-top:1px dashed #000;margin:8px 0}.r{display:flex;justify-content:space-between;gap:8px;margin:5px 0}.btn{width:100%;padding:12px;font-size:16px;margin-top:12px}@media print{.btn{display:none}}</style></head><body><div class="c b">阿財小吃</div><div class="c" style="font-size:28px;font-weight:900;margin:5px">'+esc(o.order_no)+'</div><div class="line"></div>'+rows+'<div class="line"></div><div class="r b"><span>合計</span><span>'+money(o.total)+'</span></div><p>'+esc(o.dining_type)+(o.table_no?'・桌 '+esc(o.table_no):'')+'<br>'+esc(o.payment_method)+'・'+esc(o.payment_status)+(o.note?'<br>備註：'+esc(o.note):'')+'<br>'+new Date(o.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})+'</p><button class="btn" onclick="window.print()">列印訂單</button></body></html>'}
function printOrder(o){const w=window.open('','_blank');if(!w){showStatus('瀏覽器阻擋了列印視窗，請允許彈出視窗。',true);return}w.document.open();w.document.write(receiptHtml(o));w.document.close()}
async function loadOrders(){
  try{
    const d=await rpc('smallshop_admin_orders',{p_pin:pin});const orders=Array.isArray(d.orders)?d.orders:[];const m=computeOrderMetrics(orders);
    $('#gate').classList.add('hide');$('#app').classList.remove('hide');showStatus('');
    $('#orderMetrics').innerHTML='<section class="card"><div class="metric">今日營業額</div><div class="big">'+money(m.revenue)+'</div></section><section class="card"><div class="metric">今日訂單</div><div class="big">'+m.count+'</div></section><section class="card"><div class="metric">未收款</div><div class="big">'+m.unpaid+'</div></section><section class="card"><div class="metric">製作中</div><div class="big">'+m.making+'</div></section>';
    $('#orders').innerHTML=orders.length?orders.map(o=>'<section class="card order"><div class="row between"><div><span class="num">'+esc(o.order_no)+'</span> <span class="pill">'+esc(o.status)+'</span></div><b>'+money(o.total)+'</b></div><div class="items">'+(o.items||[]).map(x=>esc(x.name)+' ×'+x.qty).join('、')+'</div><div class="sub">'+esc(o.dining_type)+(o.table_no?'・桌 '+esc(o.table_no):'')+'・'+esc(o.payment_method)+'・'+esc(o.payment_status)+'・'+new Date(o.created_at).toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit'})+'</div>'+(o.note?'<div class="note">備註：'+esc(o.note)+'</div>':'')+'<div class="row" style="margin-top:12px">'+(o.payment_status==='未收款'?'<button type="button" class="btn soft act" data-id="'+o.id+'" data-a="paid">確認收款</button>':'')+(o.status==='新訂單'?'<button type="button" class="btn primary act" data-id="'+o.id+'" data-a="making">開始製作</button>':'')+(o.status==='製作中'?'<button type="button" class="btn primary act" data-id="'+o.id+'" data-a="done">完成</button>':'')+(o.status!=='已取消'?'<button type="button" class="btn ghost print" data-id="'+o.id+'">列印</button>':'')+(o.status!=='已完成'&&o.status!=='已取消'?'<button type="button" class="btn danger act" data-id="'+o.id+'" data-a="cancel">取消</button>':'')+'</div></section>').join(''):'<section class="card empty">目前沒有訂單。客人下單後會自動出現在這裡。</section>';
    document.querySelectorAll('.act').forEach(b=>b.addEventListener('click',async()=>{b.disabled=true;try{await rpc('smallshop_admin_update',{p_pin:pin,p_id:Number(b.dataset.id),p_action:b.dataset.a});await loadOrders();if(currentPane==='ledger')await loadLedger()}catch(e){showStatus(e.message||'更新失敗',true);b.disabled=false}}));
    document.querySelectorAll('.print').forEach(b=>b.addEventListener('click',()=>{const o=orders.find(x=>Number(x.id)===Number(b.dataset.id));if(o)printOrder(o)}));
  }catch(e){$('#gate').classList.remove('hide');$('#app').classList.add('hide');showStatus(e.message||'後台讀取失敗',true)}
}
function ledgerSummary(orders){
  const valid=orders.filter(o=>o.status!=='已取消');const paid=valid.filter(o=>o.payment_status==='已收款');
  const revenue=paid.reduce((s,o)=>s+Number(o.total||0),0),cash=paid.filter(o=>o.payment_method==='現金').reduce((s,o)=>s+Number(o.total||0),0),linepay=paid.filter(o=>o.payment_method==='LINE Pay').reduce((s,o)=>s+Number(o.total||0),0);
  const daily={},products={};
  valid.forEach(o=>{const k=dayOf(o.created_at);if(!daily[k])daily[k]={date:k,orders:0,revenue:0,cash:0,linepay:0,unpaid:0};daily[k].orders++;if(o.payment_status==='已收款'){daily[k].revenue+=Number(o.total||0);if(o.payment_method==='LINE Pay')daily[k].linepay+=Number(o.total||0);else daily[k].cash+=Number(o.total||0)}else daily[k].unpaid++;(o.items||[]).forEach(it=>{const n=String(it.name||'商品');if(!products[n])products[n]={name:n,qty:0,amount:0};products[n].qty+=Number(it.qty||0);products[n].amount+=Number(it.price||0)*Number(it.qty||0)})});
  return{metrics:{revenue,cash,linepay,orders:valid.length,unpaid:valid.filter(o=>o.payment_status==='未收款').length,average:valid.length?Math.round(revenue/valid.length):0},daily:Object.values(daily).sort((a,b)=>b.date.localeCompare(a.date)),products:Object.values(products).sort((a,b)=>b.qty-a.qty)}
}
async function loadLedger(){
  const from=$('#from').value,to=$('#to').value;if(!from||!to)return;$('#query').disabled=true;$('#query').textContent='讀取中…';
  try{
    const d=await rpc('smallshop_ledger',{p_pin:pin,p_from:from,p_to:to});const orders=Array.isArray(d.orders)?d.orders:[];const s=ledgerSummary(orders);lastLedger={from:d.from||from,to:d.to||to,orders};showStatus('');const m=s.metrics;
    $('#ledgerMetrics').innerHTML='<section class="card"><div class="metric">營業額</div><div class="big">'+money(m.revenue)+'</div></section><section class="card"><div class="metric">訂單</div><div class="big">'+m.orders+'</div></section><section class="card"><div class="metric">平均客單</div><div class="big">'+money(m.average)+'</div></section><section class="card"><div class="metric">現金</div><div class="big">'+money(m.cash)+'</div></section><section class="card"><div class="metric">LINE Pay</div><div class="big">'+money(m.linepay)+'</div></section><section class="card"><div class="metric">未收款</div><div class="big">'+m.unpaid+'</div></section>';
    $('#daily').innerHTML=s.daily.length?s.daily.map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+x.orders+'</td><td><b>'+money(x.revenue)+'</b></td><td>'+money(x.cash)+'</td><td>'+money(x.linepay)+'</td><td>'+x.unpaid+'</td></tr>').join(''):'<tr><td colspan="6" class="empty">沒有資料</td></tr>';
    $('#products').innerHTML=s.products.length?s.products.slice(0,20).map((x,i)=>'<div class="rank"><div><b>'+(i+1)+'. '+esc(x.name)+'</b></div><div>'+x.qty+' 份</div><div><b>'+money(x.amount)+'</b></div></div>').join(''):'<div class="empty">沒有商品銷售資料</div>';
    $('#ledgerOrders').innerHTML=orders.length?orders.map(o=>'<tr><td>'+new Date(o.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})+'</td><td><b>'+esc(o.order_no)+'</b></td><td>'+esc((o.items||[]).map(x=>x.name+'×'+x.qty).join('、'))+'</td><td><b>'+money(o.total)+'</b></td><td>'+esc(o.payment_method)+'</td><td>'+esc(o.payment_status)+'</td><td><span class="pill">'+esc(o.status)+'</span></td></tr>').join(''):'<tr><td colspan="7" class="empty">沒有訂單</td></tr>';
  }catch(e){showStatus(e.message||'帳目讀取失敗',true)}finally{$('#query').disabled=false;$('#query').textContent='查詢帳目'}
}
function exportCsv(){
  if(!lastLedger){showStatus('請先查詢帳目',true);return}
  const fmtTime=v=>{
    const parts=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date(v));
    const g=t=>parts.find(x=>x.type===t)?.value||'';
    return g('year')+'-'+g('month')+'-'+g('day')+' '+g('hour')+':'+g('minute')+':'+g('second');
  };
  const clean=v=>String(v??'').replace(/[\u200E\u200F\u202A-\u202E\u2066-\u2069]/g,'').replace(/\r?\n/g,' ');
  const q=v=>'"'+clean(v).replace(/"/g,'""')+'"';
  const rows=[['時間','訂單','餐點','金額','付款方式','收款狀態','訂單狀態']];
  lastLedger.orders.forEach(o=>rows.push([fmtTime(o.created_at),o.order_no,(o.items||[]).map(x=>x.name+' x'+x.qty).join('、'),Number(o.total||0),o.payment_method,o.payment_status,o.status]));
  const csv='\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')+'\r\n';
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const href=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=href;a.download='營業流水帳_'+lastLedger.from+'_'+lastLedger.to+'.csv';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(href),1000);
  showStatus('CSV 已匯出（UTF-8 BOM / CRLF，Excel 相容格式）');
}
$('#login').addEventListener('click',()=>{pin=$('#pin').value.trim();loadOrders();clearInterval(timer);timer=setInterval(()=>{if(currentPane==='orders')loadOrders()},3000)});
$('#refresh').addEventListener('click',()=>currentPane==='orders'?loadOrders():loadLedger());
$('#tabOrders').addEventListener('click',()=>setPane('orders'));
$('#tabLedger').addEventListener('click',()=>setPane('ledger'));
$('#today').addEventListener('click',()=>{setToday();loadLedger()});
$('#month').addEventListener('click',()=>{setMonth();loadLedger()});
$('#query').addEventListener('click',loadLedger);
$('#csv').addEventListener('click',exportCsv);
setToday();loadOrders();timer=setInterval(()=>{if(currentPane==='orders')loadOrders()},3000);
</script>
</body>
</html>
