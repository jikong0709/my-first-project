<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6B4F3A"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./app.css"><title>手機點餐</title></head><body><main id="root" class="wrap"><header class="top"><div class="brandbox"><img id="logo" class="logo hide" alt="店家 Logo"><div><div id="brandEn" class="eyebrow">ORDER</div><div id="brandName" class="brand">手機點餐</div><div class="sub">掃碼點餐・送單後可查看製作狀態</div></div></div><div><div class="tiny">TEL</div><div id="phone" style="font-weight:850">—</div><div class="tiny" style="margin-top:8px">LOCATION</div><div id="address" style="font-weight:850">—</div></div></header><div id="notice"></div><section class="card"><div style="font-weight:950;margin-bottom:10px">用餐方式</div><div id="modeGrid" class="mode-grid"><button class="mode active" data-mode="外帶">外帶取餐</button><button class="mode" data-mode="內用">店內用餐</button></div><div class="table-wrap"><div class="field-label">桌號 <span id="tableHint">外帶免填</span></div><input id="tableNo" inputmode="numeric" placeholder="選擇內用後填寫桌號" disabled></div></section><section class="card"><div style="font-weight:950;margin-bottom:10px">訂購人資料</div><div class="field-grid"><div><div class="field-label">姓名 <span id="nameHint">外帶必填</span></div><input id="customerName" maxlength="40" autocomplete="name" placeholder="訂購人姓名"></div><div><div class="field-label">手機 <span id="phoneHint">外帶必填</span></div><input id="customerPhone" inputmode="tel" maxlength="10" autocomplete="tel" placeholder="09xxxxxxxx"></div></div></section><div class="row between" style="margin:20px 2px 8px"><div class="sec" style="margin:0">菜單</div><div id="menuCount" class="tiny">讀取中</div></div><div id="catnav" class="catnav"></div><section id="menu" class="card"><div class="empty">菜單載入中…</div></section><section class="card"><div style="font-weight:950;margin-bottom:8px">訂單備註</div><textarea id="note" rows="2" maxlength="120" placeholder="例如：不要辣、醬另放"></textarea></section><section class="card"><div style="font-weight:950;margin-bottom:8px">付款方式</div><div id="payrow" class="payrow"><button class="pay active" data-pay="現金">現金</button><button id="linePayBtn" class="pay hide" data-pay="LINE Pay">LINE Pay</button></div><div id="paymentNote" class="tiny" style="margin-top:8px">現場付款</div></section></main><div id="sticky" class="sticky"><div class="sticky-in"><div><div class="metric">ORDER TOTAL</div><div id="total" class="total">$0</div></div><button id="submit" class="btn submit" disabled>送出訂單</button></div></div><script src="./order.js"></script><script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
