<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6B4F3A"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./app.css"><title>店家訂單管理</title></head><body><main class="wrap"><header class="top"><div class="brandbox"><img id="logo" class="logo hide" alt="店家 Logo"><div><div id="brandEn" class="eyebrow">B CORE</div><div id="brandName" class="brand">店家訂單管理</div><div class="sub">即時接單・菜單管理・QR 點餐</div><div class="row" style="margin-top:7px"><span id="storeStatus" class="pill closed">未登入</span><span id="planBadge" class="pill">B Core</span></div></div></div><div class="top-actions"><a id="customerOrderLink" class="btn ghost" href="#" target="_blank" rel="noopener">客戶點餐頁</a><button id="refresh" class="btn ghost">更新</button><button id="logout" class="btn danger">登出</button></div></header><div id="status"></div><section id="gate" class="card gate"><div style="font-weight:950;margin-bottom:10px">店家登入</div><div class="gate-grid"><input id="storeSlug" autocomplete="username" placeholder="店家代碼"><input id="passcode" type="password" inputmode="numeric" autocomplete="current-password" placeholder="6–12 位數字密碼"><button id="login" class="btn primary">登入</button></div></section><div id="app" class="hide"><div class="tabs"><button class="btn tab active" data-pane="orders">即時接單</button><button class="btn tab ghost" data-pane="menu">菜單管理</button><button class="btn tab ghost" data-pane="qr">QR Code</button><button class="btn tab ghost" data-pane="settings">設定</button></div><section id="ordersPane"><div id="orderMetrics" class="metrics"></div><div class="sec">今日訂單</div><div id="orders"></div></section><section id="menuPane" class="hide"><section class="card"><div class="sec" style="margin-top:0">新增／編輯商品</div><input id="menuId" type="hidden"><div class="form-grid"><label>商品名稱<input id="menuName" maxlength="80"></label><label>價格<input id="menuPrice" type="number" min="0" inputmode="numeric"></label><label>分類<input id="menuCategory" maxlength="40" placeholder="其他"></label><label>排序<input id="menuSort" type="number" inputmode="numeric" value="0"></label></div><label class="row" style="margin-top:12px;font-weight:850"><input id="menuActive" type="checkbox" checked style="width:auto"> 上架販售</label><div class="row" style="margin-top:12px"><button id="saveMenu" class="btn primary">儲存商品</button><button id="newMenu" class="btn ghost">清空／新增</button></div></section><section class="card tablewrap"><table class="table"><thead><tr><th>商品</th><th>價格</th><th>分類</th><th>狀態</th><th>排序</th><th></th></tr></thead><tbody id="menuAdminList"></tbody></table></section></section><section id="qrPane" class="hide"><section class="card qr-card"><div class="sec" style="margin-top:0">店家點餐 QR Code</div><img id="qrImage" class="qr-image" alt="店家點餐 QR Code"><div id="qrUrl" class="qr-url"></div><div class="row" style="justify-content:center"><button id="copyQrUrl" class="btn primary">複製點餐網址</button><a id="customerOrderLink2" class="btn ghost" href="#" target="_blank" rel="noopener">開啟點餐頁</a></div></section></section><section id="settingsPane" class="hide"><section class="card"><div class="sec" style="margin-top:0">接單狀態</div><p id="openHelp" class="sub"></p><button id="toggleOpen" class="btn accent"></button></section><section class="card"><div class="sec" style="margin-top:0">店家資料</div><div class="settings-grid"><label>店名<input id="settingName" maxlength="80"></label><label>英文名稱<input id="settingBrandEn" maxlength="80"></label><label>電話<input id="settingPhone" maxlength="40"></label><label>地址<input id="settingAddress" maxlength="160"></label></div><button id="saveStore" class="btn primary" style="margin-top:12px">儲存資料</button></section><section class="card"><div class="sec" style="margin-top:0">修改密碼</div><div class="settings-grid"><label>目前密碼<input id="currentPass" type="password" inputmode="numeric"></label><label>新密碼<input id="newPass" type="password" inputmode="numeric" placeholder="6–12 位數字"></label></div><button id="changePass" class="btn primary" style="margin-top:12px">更新密碼</button><p class="tiny">更新後所有已登入裝置會立即登出。</p></section></section></div></main><script src="./admin.js"></script><script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
